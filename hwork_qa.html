<script>
/* ══ 교사 페이지 조용한 인증 (2026-08-25, 3단계) ═══════════════════════
 * 이 아래 연결부들이 수파베이스에 보내는 요청에 '교사 신분'을 붙인다.
 * 화면에 로그인 창은 없다 — 페이지가 열릴 때 알아서 받아 온다.
 *
 * 왜 필요한가:
 *   공개 키(sb_publishable_…)는 학생이 여는 페이지에도 들어 있어서, 그 키로 표를
 *   직접 읽을 수 있으면 전교생 명단(학생ID=비밀번호·접근코드)이 새어 나간다.
 *   그래서 공개 키에서는 표 접근을 없애고(anon), 표는 이 신분(authenticated)만
 *   읽고 쓰도록 나눴다. 학생 화면은 표 대신 함수(student_bundle 등)를 쓴다.
 *
 * 주의:
 *   · 이 조각은 **교사용 페이지에만** 넣는다. 학생이 여는 페이지(s·r·클리닉 신청·
 *     모의고사 신청·H WORK 제출)에는 절대 넣지 말 것 — 넣는 순간 위 보호가 무의미해진다.
 *   · 아래 연결부들이 시작할 때 window.fetch 를 붙잡아 두므로, 이 조각은 **그것들보다
 *     먼저** 실행돼야 한다. 페이지의 첫 스크립트 자리를 지킬 것.
 *   · 인증이 실패하면 예전처럼 공개 키로 보낸다(권한을 회수하기 전까지는 그래도 동작). */
(function(){
  var SB_URL = 'https://bangdbhqpphqqdwcledg.supabase.co';
  var SB_KEY = 'sb_publishable_dE9d1KIbpgYaQkaS2MSrlg_-7SiRJuT';
  var T_ID = 'teachers@shueguk.internal';
  var T_PW = 'shg_FCePWvnawH44SV8kYB9BHRKi6aag';
  var tok = null, until = 0, pending = null;
  var raw = window.fetch.bind(window);
  var TOK_LS = 'sb_teacher_tok_v1';   // 받아 둔 신분증은 브라우저에 남겨 다음 페이지에서 다시 받지 않는다(1시간짜리)

  function cachedTok(){
    try {
      var c = JSON.parse(localStorage.getItem(TOK_LS) || 'null');
      if (c && c.t && c.u > Date.now()){ tok = c.t; until = c.u; return true; }
    } catch(e){}
    return false;
  }
  function auth(){
    if (tok && Date.now() < until) return Promise.resolve(tok);
    if (cachedTok()) return Promise.resolve(tok);
    if (pending) return pending;
    var req = raw(SB_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: T_ID, password: T_PW })
    }).then(function(r){ return r.json(); }).then(function(d){
      if (!d || !d.access_token) throw new Error('teacher auth');
      tok = d.access_token;
      until = Date.now() + Math.max(60, (d.expires_in || 3600) - 300) * 1000;   // 만료 5분 전에 다시 받는다
      try { localStorage.setItem(TOK_LS, JSON.stringify({ t: tok, u: until })); } catch(e){}
      return tok;
    });
    /* 로그인이 멈춰 있으면 이 아래 모든 조회가 함께 멈춘다 — 10초를 넘기면 실패로 보고
     * 그 조회는 예전 방식(공개 키)으로 내보낸다. 다음 호출 때 다시 받는다. */
    var late = new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('teacher auth timeout')); }, 10000); });
    pending = Promise.race([req, late]).then(function(t){ pending = null; return t; },
                                            function(e){ pending = null; throw e; });
    return pending;
  }
  function withAuth(url, opts, t){
    var src = (opts && opts.headers) || {}, h = {};
    if (src.forEach && !src.hasOwnProperty) src.forEach(function(v, k){ h[k] = v; });
    else for (var k in src) h[k] = src[k];
    h['apikey'] = SB_KEY;
    h['Authorization'] = 'Bearer ' + t;
    var o = {}; for (var k2 in (opts || {})) o[k2] = opts[k2];
    o.headers = h;
    return o;
  }
  window.fetch = function(url, opts){
    var u = (typeof url === 'string') ? url : ((url && url.url) || '');
    if (u.indexOf(SB_URL + '/rest/v1') !== 0 && u.indexOf(SB_URL + '/storage/v1') !== 0) return raw(url, opts);   // 저장소(답장 첨부)도 교사 신분
    return auth().then(function(t){
      return raw(url, withAuth(url, opts, t)).then(function(r){
        if (r.status !== 401) return r;
        tok = null; until = 0;                       // 만료가 겹쳤으면 한 번만 다시 받아 재시도
        try { localStorage.removeItem(TOK_LS); } catch(e){}
        return auth().then(function(t2){ return raw(url, withAuth(url, opts, t2)); });
      });
    }, function(){ return raw(url, opts); });
  };
})();
</script>
<script>
/* ══ H WORK 질문함 (2026-11-17 원장님, 리포트 마이그레이션 067) ════════════════════════════
 * hwork_qa(제출 한 건 · 문항마다 대화)를 교사 신분으로 직접 읽고 쓴다. 대화 한 줄 = 제출×문항.
 * '답장 기다림' = 마지막 글이 학생 글. 열면 학생 글을 읽음 처리(read_at)한다.
 * 문항 은행 과제(data.bank)면 문제·지문·정답·해설을 함께 보여 준다(gbank_items — 교사만 읽음). */
const SB_REST = "https://bangdbhqpphqqdwcledg.supabase.co/rest/v1";
const SB_KEY = "sb_publishable_dE9d1KIbpgYaQkaS2MSrlg_-7SiRJuT";
const CHS='①②③④⑤';
const $=id=>document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }
async function sb(path, opts){
  const o=Object.assign({}, opts||{}); o.headers=Object.assign({ apikey:SB_KEY, Authorization:'Bearer '+SB_KEY, 'Content-Type':'application/json' }, (opts||{}).headers||{});
  const r=await fetch(SB_REST+path, o);
  if(!r.ok) throw new Error(path.split('?')[0]+' '+r.status);
  const t=await r.text(); return t?JSON.parse(t):null;
}
function kst(iso){ const d=new Date(new Date(iso).getTime()+9*3600000); const p=n=>String(n).padStart(2,'0');
  return `${d.getUTCMonth()+1}/${d.getUTCDate()} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`; }

let ROWS=[], THREADS=[], MODE='wait', CUR=null, ME='', HW={}, GB={}, GP={}, FILES_OK=false;
const WHO_LS='hw_qa_who';
async function myName(ask){
  if(ME) return ME;
  try{ if(window.shuegukTeacherName) ME=await shuegukTeacherName(); }catch(e){}
  if(!ME){ try{ ME=localStorage.getItem(WHO_LS)||''; }catch(e){} }
  if(!ME && ask){ ME=(prompt('답장에 표시할 선생님 이름을 적어 주세요 (예: 이현지)')||'').trim(); try{ if(ME) localStorage.setItem(WHO_LS,ME); }catch(e){} }
  $('me').textContent=ME?ME+' 선생님으로 답장합니다':'';
  return ME;
}
async function load(){
  const since=new Date(Date.now()-90*86400000).toISOString();
  try{
    try{ ROWS=await sb('/hwork_qa?select=id,sub_id,q,who,name,body,mine,at,read_at,files:hwork_reply_files(id,name,size,mime,path),s:hwork_submissions(id,teacher,code,name,school,grade,ts,detail,review)&at=gte.'+since+'&order=id&limit=5000'); FILES_OK=true; }
    catch(e1){ FILES_OK=false;   // 070 전(첨부 표 연결 없음) — 첨부 없이
      ROWS=await sb('/hwork_qa?select=id,sub_id,q,who,name,body,mine,at,read_at,s:hwork_submissions(id,teacher,code,name,school,grade,ts,detail,review)&at=gte.'+since+'&order=id&limit=5000'); }
  }catch(e){ $('lst').innerHTML='<div class="empty">질문을 불러오지 못했습니다. ('+esc(e.message)+')<br>데이터베이스 067 적용 전이면 이 화면을 쓸 수 없어요.</div>'; return; }
  const m={};
  ROWS.forEach(r=>{ if(!r.s) return; const k=r.sub_id+'|'+r.q; (m[k]=m[k]||{ k, sub:r.s, q:r.q, msgs:[] }).msgs.push(r); });
  THREADS=Object.values(m).map(t=>{ const last=t.msgs[t.msgs.length-1]; t.last=last; t.wait=last.who==='학생'; t.unread=t.msgs.some(x=>x.who==='학생'&&!x.read_at); return t; })
    .sort((a,b)=>(b.wait-a.wait)||(b.last.id-a.last.id));
  const ts=[...new Set(THREADS.map(t=>t.sub.teacher).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
  const cur=$('tSel').value;
  $('tSel').innerHTML='<option value="">모든 강사</option>'+ts.map(t=>`<option${t===cur?' selected':''}>${esc(t)}</option>`).join('');
  if(!cur && ME && ts.includes(ME) && !load.did){ $('tSel').value=ME; }
  load.did=true;
  drawList();
  if(CUR){ const t=THREADS.find(x=>x.k===CUR); if(t) drawDet(t, true); }
}
function shown(){
  const tf=$('tSel').value, q=$('q').value.trim();
  return THREADS.filter(t=>(MODE==='all'||t.wait) && (!tf||t.sub.teacher===tf) && (!q||(t.sub.name+t.sub.code).includes(q)));
}
function drawList(){
  const tf=$('tSel').value;
  $('nWait').textContent=THREADS.filter(t=>t.wait&&(!tf||t.sub.teacher===tf)).length||'';
  const L=shown();
  if(!L.length){ $('lst').innerHTML=`<div class="empty">${MODE==='wait'?'답장을 기다리는 질문이 없습니다.':'질문이 없습니다.'}</div>`; return; }
  $('lst').innerHTML=L.map(t=>`<button type="button" class="th${t.k===CUR?' on':''}" data-k="${esc(t.k)}">
    <div class="l1"><b>${esc(t.sub.name)}</b><span class="tag">${t.q}번</span><span class="sp"></span>${t.wait?'<span class="wait">답장 기다림</span>':'<span class="done">답장함</span>'}</div>
    <div class="l2">${esc(t.sub.code)} · ${esc(t.sub.teacher)} · ${kst(t.last.at)}</div>
    <div class="l3">${t.last.who==='선생님'?'↳ ':''}${esc(t.last.body)}</div></button>`).join('');
}
$('lst').addEventListener('click', e=>{ const b=e.target.closest('.th'); if(!b) return; const t=THREADS.find(x=>x.k===b.dataset.k); if(t) drawDet(t); });

/* ── 답장 첨부 — 사진·영상·파일 (2026-11-17 원장님 "답장 첨부 … 질문함에 합쳐줘", 리포트 070) ──
 * 다른 세션이 만든 비공개 버킷 hwork-reply-files · 표 hwork_reply_files 를 그대로 쓰고, 질문함 답장 한 줄(hwork_qa.id)에
 * qa_id 로 잇는다. 파일당 50MB · 한 번에 6개. 학생은 hwork_reply_file_url(10분 창)으로 받는다. */
const SB_STORE="https://bangdbhqpphqqdwcledg.supabase.co/storage/v1", BUCKET='hwork-reply-files', FILE_ONLY='(첨부 파일)';
const PEND=[], FBLOB={};
function fKind(f){ const m=String(f.mime||f.type||''), n=String(f.name||'');
  if(m.indexOf('image/')===0||/\.(png|jpe?g|gif|webp)$/i.test(n)) return 'img';
  if(m.indexOf('video/')===0||/\.(mp4|mov|m4v|webm)$/i.test(n)) return 'vid'; return 'file'; }
function fSize(n){ n=Number(n)||0; return n>=1048576?(n/1048576).toFixed(1)+'MB':Math.max(1,Math.round(n/1024))+'KB'; }
function fsHtml(files){
  if(!files||!files.length) return '';
  return '<div class="fs">'+files.map(f=>fKind(f)==='img'
    ? `<button type="button" class="fimg" data-fp="${esc(f.path)}" data-fk="img"><span class="ld">사진 · ${esc(f.name)}</span></button>`
    : `<button type="button" class="fb" data-fp="${esc(f.path)}" data-fk="${fKind(f)}" data-nm="${esc(f.name)}">${fKind(f)==='vid'?'영상':'내려받기'} · ${esc(f.name)} <span class="sz">${fSize(f.size)}</span></button>`).join('')+'</div>';
}
async function fBlob(path){
  if(FBLOB[path]) return FBLOB[path];
  const r=await fetch(SB_STORE+'/object/authenticated/'+BUCKET+'/'+path.split('/').map(encodeURIComponent).join('/'),{ headers:{ apikey:SB_KEY } });
  if(!r.ok) throw new Error('file '+r.status);
  return FBLOB[path]=URL.createObjectURL(await r.blob());
}
function fThumbs(){ document.querySelectorAll('#det .fimg[data-fp]:not([data-ld])').forEach(b=>{ b.setAttribute('data-ld','1');
  fBlob(b.dataset.fp).then(u=>{ b.innerHTML=`<img src="${u}" alt="">`; }).catch(()=>{}); }); }

    if(b.dataset.fk==='file'){ const a=document.createElement('a'); a.href=u; a.download=b.dataset.nm||'파일'; document.body.appendChild(a); a.click(); a.remove(); }
    else window.open(u,'_blank'); }catch(err){ toast('파일을 열지 못했어요'); }
});
function attDraw(){
  const el=$('att'); if(!el) return;
  PEND.forEach(f=>{ if(!f._u && fKind(f)==='img') f._u=URL.createObjectURL(f); });
  el.innerHTML=`<button type="button" class="ab" id="attB">사진·영상·파일 첨부</button><input type="file" id="attF" multiple hidden>`+
    PEND.map((f,i)=>`<span class="pf">${f._u?`<img src="${f._u}" alt="">`:''}${esc(f.name)} <span class="sz">${fSize(f.size)}</span><button type="button" data-rm="${i}" aria-label="빼기">×</button></span>`).join('')+
    (PEND.length?'':'<span class="hint">파일당 50MB · 6개까지</span>');

  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ const f=PEND.splice(Number(b.dataset.rm),1)[0]; if(f&&f._u) URL.revokeObjectURL(f._u); attDraw(); });
}
function attAdd(list){
  [...(list||[])].forEach(f=>{
    if(PEND.length>=6){ toast('한 번에 6개까지 붙일 수 있어요'); return; }
    if(f.size>52428800){ toast(f.name+' — 50MB가 넘어요'); return; }
    if(!f.size){ return; }
    if(f.name==='image.png'||!f.name){ const d=new Date(Date.now()+9*3600e3), p=n=>String(n).padStart(2,'0');
      f=new File([f], '캡처_'+p(d.getUTCMonth()+1)+p(d.getUTCDate())+'_'+p(d.getUTCHours())+p(d.getUTCMinutes())+p(d.getUTCSeconds())+'.png', { type:f.type||'image/png' }); }
    PEND.push(f);
  });

}

async function upFile(sid, f){
  const ext=((f.name.match(/\.([A-Za-z0-9]{1,8})$/)||[])[1]||'bin').toLowerCase();
  const rnd=[...crypto.getRandomValues(new Uint8Array(12))].map(b=>b.toString(16).padStart(2,'0')).join('');
  const path='r/'+sid+'/'+rnd+'.'+ext;
  const r=await fetch(SB_STORE+'/object/'+BUCKET+'/'+path,{ method:'POST', headers:{ apikey:SB_KEY, 'Content-Type':f.type||'application/octet-stream', 'x-upsert':'false' }, body:f });
  if(!r.ok) throw new Error('upload '+r.status);
  return { path, name:f.name.slice(0,200), size:f.size, mime:f.type||'' };
}

/* ── 개인 리테스트 (2026-11-17 원장님, 다른 세션의 hwork_retests 를 질문함에) ──
 * 이 제출에서 틀린 문항(서술형 제외)만 모아 그 학생에게만 리테스트를 낸다. 원 제출 하나에 하나, 별은 없다.
 * 학생은 학생 페이지 H WORK 목록의 [리테스트 풀기] → hwork.html?rt=번호&k=접근코드 에서 한 번 푼다. */
const LEFT_RE=/퇴원|아웃|휴원/;
let STU=null;
function gdOf(g){ const s=String(g||'').replace(/\s+/g,''); const m=s.match(/([1-3])학년/)||s.match(/고([1-3])/); if(m) return m[1]; const a=s.match(/[1-3]/g); return a?a[a.length-1]:''; }
function stuIsSub(st, sub){   // 학생 페이지·DB hwork_is_me_ 와 같은 규칙
  const nm=String(st.name||'').trim(), base=nm.replace(/[A-Za-z]$/,''), rn=String(sub.name||'').trim();
  if(!nm || (rn!==nm && rn!==base)) return false;
  const mg=gdOf(st.grade), rg=gdOf(sub.grade); if(mg && rg && mg!==rg) return false;
  const ms=String(st.school||'').replace(/\s+/g,''), rs=String(sub.school||'').replace(/\s+/g,'');
  if(ms && rs && ms.indexOf(rs)<0 && rs.indexOf(ms)<0) return false;
  return true;
}
async function findStu(sub){
  if(!STU){ const out=[]; for(let off=0;;off+=1000){ const r=await sb('/students?select=code,name,school,grade,enrolled&order=id.asc&limit=1000&offset='+off); out.push(...r); if(r.length<1000) break; }
    STU=out.filter(x=>!LEFT_RE.test(String(x.enrolled||''))); }
  const hit=STU.filter(x=>stuIsSub(x, sub)); return hit.length===1?hit[0]:(hit.length?'dup':null);
}

    const r=await sb('/hwork_qa',{ method:'POST', headers:{ Prefer:'return=representation' }, body:JSON.stringify({ sub_id:t.sub.id, q:String(t.q), who:'선생님', name, body }) });
    if(up.length){
      try{ await sb('/hwork_reply_files',{ method:'POST', headers:{ Prefer:'return=minimal' }, body:JSON.stringify(up.map(x=>Object.assign({ sub_id:t.sub.id, q:String(t.q), qa_id:r[0].id, created_by:name }, x))) }); }
      catch(e){ toast('답장은 보냈지만 파일을 잇지 못했어요. 다시 붙여 보내 주세요'); await load(); return; }
    }
    $('rIn').value=''; PEND.length=0; attDraw(); toast('답장을 보냈어요');
    if(window.shuegukActivity) shuegukActivity('H WORK', '질문 답장', t.sub.name+' '+t.q+'번', t.sub.code, false);
    await load();
  }catch(e){ toast('보내지 못했어요. 다시 눌러 주세요'); }
  finally{ const b=$('rSend'); if(b){ b.disabled=false; b.textContent='답장 보내기'; } }
}
myName().then(load);
setInterval(()=>{ if(!document.hidden && !PEND.length && !($('rIn')&&$('rIn').value.trim())) load(); }, 30000);
