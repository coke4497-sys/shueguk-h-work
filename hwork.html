<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>이수경국어 · H WORK 제출</title>
<link rel="apple-touch-icon" href="icon-hwork.png">
<link rel="icon" type="image/png" href="icon-hwork.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="H WORK">
<meta name="theme-color" content="#628C83">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
  :root{
    --sage:#A6C1BB; --sage-d:#628C83;
    --lav:#628C83; --lav-d:#628C83;
    --ink:#2C2F2D; --muted:#8B928C;
    --line:#D4D8D3; --paper:#FBFAF6; --card:#ffffff;
    --ok:#3E9B74; --ok-bg:#E4F1EA; --bad:#DB4C39; --bar:#628C83;
    --shadow:0 2px 10px rgba(63,58,68,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Gowun Dodum',-apple-system,sans-serif;
    background:var(--paper); color:var(--ink);
    max-width:480px; margin:0 auto; padding:0 0 110px; line-height:1.5;
  }
  .brand{
    background:linear-gradient(135deg,#C6D5D2 0%,#C6D5D2 100%);
    padding:22px 20px 18px; text-align:center; border-radius:0 0 22px 22px; box-shadow:var(--shadow);
  }
  .brand .name{ font-family:'Gowun Batang',serif; font-weight:700; font-size:27px; letter-spacing:3px; color:#2C2F2D; }
  .brand .sub{ font-family:'Gowun Batang',serif; font-size:14px; color:#3A544E; letter-spacing:4px; margin-top:5px; }
  .title-bar{
    background:var(--card); margin:16px 16px 0; padding:13px 18px; border-radius:12px; box-shadow:var(--shadow);
    font-family:'Gowun Batang',serif; font-size:15px; font-weight:700;
  }
  .card{ background:var(--card); margin:16px; padding:18px; border-radius:14px; box-shadow:var(--shadow); }
  .card h3{ margin:0 0 14px; font-size:15px; font-family:'Gowun Batang',serif; display:flex; align-items:center; gap:8px; }
  .card h3::before{ content:""; width:8px; height:8px; border-radius:50%; background:var(--sage); }
  label{ display:block; font-size:13px; color:var(--muted); margin:12px 0 5px; }
  input[type=text]{
    width:100%; padding:13px 14px; border:1.5px solid var(--line); border-radius:10px;
    font-size:16px; font-family:inherit; background:#fafafb;
  }
  input[type=text]:focus{ outline:none; border-color:var(--lav); background:#fff; }
  .sel{
    width:100%; padding:13px 12px; border:1.5px solid var(--line); border-radius:10px;
    font-size:16px; font-family:inherit; background:#fafafb; color:var(--ink);
    -webkit-appearance:none; appearance:none;
  }
  .sel:focus{ outline:none; border-color:var(--lav); background:#fff; }
  .sel:disabled{ background:#F4F5F3; color:var(--muted); }

  .progress-wrap{ position:sticky; top:0; z-index:20; background:var(--paper); padding:10px 16px 8px; backdrop-filter:blur(4px); }
  .progress-info{ display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:6px; }
  .progress-info b{ color:var(--lav-d); font-size:14px; }
  .bar{ height:7px; background:var(--line); border-radius:99px; overflow:hidden; }
  .bar > i{ display:block; height:100%; width:0; background:linear-gradient(90deg,var(--sage),var(--lav)); transition:width .3s; }

  .sec-label{ margin:14px 16px 4px; font-size:12px; letter-spacing:1px; color:var(--lav-d); font-weight:700; }
  .q{
    background:var(--card); margin:8px 16px; padding:12px 14px; border-radius:13px; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:10px;
  }
  .q.answered{ box-shadow:0 0 0 1.5px var(--sage) inset, var(--shadow); }
  .q .num{ width:30px; flex-shrink:0; text-align:center; font-family:'Gowun Batang',serif; font-weight:700; font-size:16px; }
  .qbody{ flex:1; min-width:0; }
  /* 답 고르기 칸 (2026-11-17 원장님 "모바일 OMR 이 어떻게 작동하는지 직관적이지 않아요") — 동그라미 숫자 대신 ①~⑤ 큰 칸, 위에 안내 한 줄, 다시 누르면 지움 */
  .pickh{ font-size:12.5px; color:var(--muted); margin:8px 0 6px; }
  .pickh b{ color:var(--sage-d); }
  .choices{ display:flex; gap:6px; }
  .choices button{
    flex:1; min-width:0; height:48px; border:1.5px solid var(--line); background:#fff; border-radius:12px;
    font-size:21px; line-height:1; color:#6b746f; font-family:'Gowun Batang',serif; cursor:pointer; transition:background .12s, border-color .12s;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  }
  .choices button:active{ transform:scale(.94); }
  .choices button.sel{ background:var(--sage-d); border-color:var(--sage-d); color:#fff; font-weight:700; box-shadow:0 2px 6px rgba(127,160,143,.4); }
  .ox{ display:flex; gap:8px; }
  .ox button{
    flex:1; height:48px; border:1.5px solid var(--line); background:#fff; border-radius:12px;
    font-size:19px; color:#6b746f; font-family:'Gowun Batang',serif; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  }
  .ox button small{ font-family:'Gowun Dodum',sans-serif; font-size:12px; margin-left:4px; }
  .ox button.sel{ background:var(--sage-d); border-color:var(--sage-d); color:#fff; font-weight:700; }
  .q{ scroll-margin-top:118px; }
  /* 선생님 확인 하트 팝업 */
  .hpop{ position:fixed; inset:0; z-index:80; background:rgba(40,46,43,.42); display:flex; align-items:center; justify-content:center; padding:20px; }
  .hpc{ background:#fff; border-radius:24px; padding:22px 20px 18px; max-width:340px; width:100%; text-align:center; display:flex; flex-direction:column; gap:10px; animation:hpIn .35s ease-out; }
  .hst{ position:relative; height:150px; display:flex; align-items:center; justify-content:center; }
  .hst img{ width:140px; height:auto; animation:hpPop .6s ease-out; }
  .hst .hb{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(.4); opacity:0; animation:hpFly 1.5s ease-out forwards; pointer-events:none; }
  .ht{ font-family:'Gowun Batang',serif; font-weight:700; font-size:18px; color:#2b3a33; line-height:1.45; }
  .ht .hh{ color:#e86a93; }
  .hn{ background:#fdf0f4; color:#8a3a57; border-radius:12px; padding:10px 12px; font-size:15px; line-height:1.5; }
  .hw{ font-size:14.5px; color:#3d4a43; line-height:1.55; word-break:keep-all; }
  .hr{ background:#f6e6e9; color:#a8434f; border-radius:12px; padding:9px 12px; font-size:14px; line-height:1.5; word-break:keep-all; }
  .hs{ font-size:15px; color:#8a3a57; font-weight:700; line-height:1.55; word-break:keep-all; }
  .hok{ border:0; border-radius:14px; background:#e86a93; color:#fff; font-size:16px; padding:13px; font-family:inherit; cursor:pointer; margin-top:4px; }
  @keyframes hpIn{ from{ transform:scale(.9); opacity:0; } to{ transform:none; opacity:1; } }
  @keyframes hpPop{ 0%{ transform:scale(.6); } 60%{ transform:scale(1.08); } 100%{ transform:scale(1); } }
  @keyframes hpFly{ 0%{ opacity:0; transform:translate(-50%,-50%) scale(.4); } 20%{ opacity:1; } 100%{ opacity:0; transform:translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1.1); } }
  @media (prefers-reduced-motion: reduce){ .hpc,.hst img{ animation:none; } }
  /* 세트 클리어 팝업 (2026-11-19) */
  .hpc.clr{ max-width:360px; }
  .clr .cs{ font-family:'Do Hyeon',sans-serif; font-size:30px; color:#4a4266; line-height:1.1; }
  .clr .nq{ font-size:14.5px; color:#3d4a43; font-weight:700; margin-top:4px; }
  .clr .nb{ background:#f3eff8; border-radius:14px; padding:10px 12px; text-align:left; font-size:14px; color:#4a4266; line-height:1.45; word-break:keep-all; }
  .clr .nb small{ display:block; color:#7a7290; font-size:12px; margin-bottom:2px; }
  .clr .go{ border:0; border-radius:14px; background:#4a4266; color:#fff; font-size:16px; padding:13px; font-family:inherit; cursor:pointer; text-decoration:none; display:block; }
  .clr .alt{ border:0; border-radius:14px; background:#e6e2f2; color:#4a4266; font-size:15px; padding:12px; font-family:inherit; cursor:pointer; text-decoration:none; display:block; }
  .clr .cl{ border:0; background:none; color:#6b736e; font-size:13.5px; padding:6px; font-family:inherit; cursor:pointer; text-decoration:underline; }
  /* 휴대폰 (2026-11-17 원장님 "학생 화면도 휴대폰에서 확인") — 문제 원문이 있는 문항은 번호를 위로 올려 문제 글 폭을 넓힌다 */
  @media (max-width:520px){
    .q{ margin:8px 10px; padding:12px; align-items:flex-start; }
    .q .num{ width:24px; padding-top:2px; }
    .q.bank{ flex-direction:column; gap:4px; }
    .q.bank .qbody{ width:100%; align-self:stretch; }
    .q.bank .num{ width:auto; text-align:left; font-size:17px; color:var(--sage-d); }
    .q.bank .num::after{ content:'번'; font-size:13px; margin-left:1px; }
  }
  /* 위 고정 줄의 답안표 — 번호 칸이 답을 고르면 채워지고, 누르면 그 문항으로 */
  .omr{ display:flex; gap:5px; overflow-x:auto; padding:8px 0 2px; scrollbar-width:none; }
  .omr::-webkit-scrollbar{ display:none; }
  .omr button{ flex:0 0 auto; min-width:34px; height:34px; padding:0 4px; border:1.5px solid var(--line); background:#fff; border-radius:9px;
    font-size:12px; color:#8a938e; font-family:inherit; cursor:pointer; line-height:1.05; -webkit-tap-highlight-color:transparent; }
  .omr button b{ display:block; font-size:13px; color:#fff; font-family:'Gowun Batang',serif; }
  .omr button.on{ background:var(--sage-d); border-color:var(--sage-d); color:#e8f1ec; }
  .omr button.essay{ border-style:dashed; }
  .tans{ width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:10px;
    font-size:16px; font-family:inherit; background:#fafafb; }
  .tans:focus{ outline:none; border-color:var(--lav); background:#fff; }
  .qtype{ font-size:11px; color:var(--muted); margin-bottom:5px; }
  .qask{ margin-top:9px; padding:6px 13px; border:1.5px solid var(--line); background:#fff; color:var(--lav-d);
    border-radius:18px; font-size:12.5px; font-family:inherit; cursor:pointer; }
  .qask:active{ transform:scale(.96); }
  .qask.has{ background:var(--lav); border-color:var(--lav); color:#fff; font-weight:700; }
  .qnote{ width:100%; margin-top:9px; padding:10px 12px; border:1.5px solid var(--lav); border-radius:10px;
    font-size:14px; font-family:inherit; background:#fff; resize:vertical; min-height:46px; line-height:1.5; }
  .qnote:focus{ outline:none; border-color:var(--lav-d); }

  .footer{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px;
    padding:12px 16px 22px; background:linear-gradient(to top,var(--paper) 70%,transparent);
  }
  #submit{
    width:100%; padding:17px; border:none; border-radius:13px; background:var(--lav-d); color:#fff;
    font-size:17px; font-weight:700; font-family:'Gowun Batang',serif; cursor:pointer; letter-spacing:2px;
    box-shadow:0 4px 14px rgba(141,131,168,.4);
  }
  #submit:active{ opacity:.85; }
  #submit:disabled{ background:var(--muted); box-shadow:none; }
  .fbtns{ display:flex; gap:8px; }
  #pauseBtn{ flex:0 0 34%; padding:17px 6px; border:none; border-radius:13px; background:#EDE4F4; color:#4A4266; font-size:15px; font-family:inherit; cursor:pointer; }
  .dnd-re{ background:#fff; border-radius:10px; padding:10px 12px; font-size:13.5px; line-height:1.6; margin:8px 0 2px; }
  .dnd-new{ display:block; width:100%; margin-top:8px; border:0; border-radius:12px; padding:11px; background:transparent; color:#6B5B7B; font-size:14px; font-family:inherit; cursor:pointer; text-decoration:underline; }
  .dnd-n a{ color:#4A4266; }
  .paused{ background:#EDE4F4; border-radius:14px; padding:18px 16px 14px; margin:6px 0 14px; color:#4A4266; font-size:14px; line-height:1.6; }
  .paused .ph{ font-family:'Gowun Batang',serif; font-weight:700; font-size:17px; margin-bottom:6px; }
  .paused p{ margin:4px 0; } .paused .pn{ color:#6B5B7B; font-size:13px; }

  .notice{ margin:16px; padding:14px 16px; border-radius:12px; font-size:13.5px; line-height:1.6; white-space:pre-wrap; }
  .notice.bad{ background:#FADED9; color:#992F20; }
  .notice.info{ background:var(--ok-bg); color:#276B4E; }

  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:11px 20px; border-radius:99px; font-size:13px;
    opacity:0; transition:all .25s; pointer-events:none; z-index:50; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ── 결과 ── */
  #report{ display:none; }
  #report .rbrand{ background:linear-gradient(135deg,#C6D5D2 0%,#C6D5D2 100%); padding:22px; text-align:center;
    border-radius:0 0 22px 22px; box-shadow:var(--shadow); }
  #report .rbrand .name{ font-family:'Gowun Batang',serif; font-weight:700; font-size:24px; letter-spacing:2px; color:#2C2F2D; }
  #report .rbrand .sub{ font-family:'Gowun Batang',serif; font-size:13px; color:#3A544E; letter-spacing:2px; margin-top:4px; }
  #report .tbar{ background:#E0EAE7; margin:16px; padding:11px 18px; border-radius:10px;
    font-family:'Gowun Batang',serif; font-size:15px; font-weight:700; color:#3A544E; text-align:center; }
  #report section{ margin:16px; }
  #report h2{ font-family:'Gowun Batang',serif; font-size:16px; margin:0 0 10px; display:flex; align-items:center; gap:8px; }
  #report h2::before{ content:""; width:9px;height:9px;border-radius:2px;background:var(--lav); }
  #report table{ width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; box-shadow:var(--shadow); }
  #report th,#report td{ padding:10px 8px; text-align:center; font-size:13.5px; }
  #report .info th{ background:#E0EAE7; color:#3A544E; font-weight:700; }
  #report .info td{ background:#efeef1; }
  #report .big{ font-family:'Gowun Batang',serif; font-size:30px; font-weight:700; color:var(--lav-d); }
  #report .scoreline{ text-align:center; margin:6px 0 2px; }
  #report .scoreline .pct{ font-size:14px; color:var(--muted); }
  #report table.detail th{ background:#E0EAE7; color:#2C2F2D; }
  /* 서술형(예시 답 비교, essay) — 2026-11-10 원장님: OX 채점 없이 예시 답과 비교 */
  .eans{ width:100%; min-height:96px; padding:11px 13px; border:1.5px solid var(--line); border-radius:10px;
    font-size:15px; font-family:inherit; background:#fafafb; resize:vertical; line-height:1.6; }
  .eans:focus{ outline:none; border-color:var(--lav); background:#fff; }
  #report td.cmp{ color:var(--lav-d); font-size:12.5px; }
  #report .snote{ text-align:center; font-size:12.5px; color:var(--muted); margin-top:6px; }
  #report .ess{ background:#fff; border-radius:12px; box-shadow:var(--shadow); padding:14px 16px; margin-bottom:12px; }
  #report .ess .eh{ font-family:'Gowun Batang',serif; font-weight:700; font-size:15px; margin-bottom:8px; }
  #report .ess .lab{ font-size:12px; color:var(--muted); margin:8px 0 4px; }
  #report .ess .box{ background:#F4F7F6; border-radius:10px; padding:10px 12px; font-size:14px; line-height:1.65;
    white-space:pre-wrap; word-break:break-all; }
  #report .ess .box.model{ background:#EDF3F1; color:#2C3E39; }
  #report .ess .eshow{ margin-top:10px; padding:9px 16px; border:none; border-radius:18px; background:#E0EAE7;
    color:#3A544E; font-size:13.5px; font-family:inherit; font-weight:700; cursor:pointer; }
  #report .ess .tip{ font-size:12.5px; color:var(--lav-d); margin-top:8px; }
  #report table.detail td{ border-bottom:1px solid var(--line); }
  #report table.detail td.qn{ background:#E0EAE7; font-weight:700; color:#3A544E; width:48px; }
  #report table.detail tr.wrong td{ background:#FADED9; }
  #report td.o{ color:var(--ok); font-weight:700; }
  #report td.x{ color:var(--bad); font-weight:700; }
  #report .blank{ color:var(--muted); font-size:12px; }
  #report .mine{ word-break:break-all; }
  /* 다시 풀기 · 오답 정리 (2026-11-11) */
  #report .hide{ color:var(--muted); font-size:12px; }
  #report .reveal{ color:#2C3E39; }
  #report .m2{ font-size:11.5px; color:var(--muted); font-weight:400; word-break:break-all; }
  #report .step{ background:#fff; border-radius:14px; box-shadow:var(--shadow); padding:16px; }
  #report .step.done{ background:#E4F1EA; }
  #report .step .guide{ font-size:13.5px; color:#3A544E; line-height:1.6; margin-bottom:10px; }
  #report .rv{ border-top:1px solid var(--line); padding:12px 0; }
  #report .rvh{ font-size:14px; font-weight:700; color:#2C2F2D; }
  #report .rvh b{ color:var(--bad); font-weight:700; }
  #report .rvh b.ok{ color:var(--ok); }
  #report .lab{ font-size:12px; color:var(--muted); margin:9px 0 5px; }
  #report .whys{ display:flex; flex-wrap:wrap; gap:6px; }
  #report .why{ padding:8px 13px; border:none; border-radius:18px; background:#EDE4F4; color:#5A4A6A;
    font-size:13.5px; font-family:inherit; cursor:pointer; }
  #report .why.on{ background:#5A4A6A; color:#fff; font-weight:700; }
  #report .fix{ width:100%; min-height:72px; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px;
    font-size:15px; font-family:inherit; background:#fafafb; resize:vertical; line-height:1.6; }
  #report .stepbtn{ width:100%; margin-top:12px; padding:15px; border:none; border-radius:12px; background:var(--lav-d);
    color:#fff; font-size:16px; font-family:inherit; font-weight:700; cursor:pointer; }
  #report .stepbtn:disabled{ background:var(--muted); }
  #report .whytag{ font-size:12.5px; background:#EDE4F4; color:#5A4A6A; padding:2px 9px; border-radius:10px; font-family:'Gowun Dodum',sans-serif; }
  .resume h3{ font-size:15px; }
  .rsrow{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line); font-size:13.5px; }
  .rsrow .rsn{ font-size:12px; color:var(--muted); }
  .rsrow button{ flex:none; padding:8px 14px; border:none; border-radius:16px; background:#EDE4F4; color:#5A4A6A; font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; }
  #report .rv.clr{ background:#F4FAF6; }
  #report .rvh b.ng, #report .hist b.ng{ color:var(--bad); }
  #report .hist{ font-size:12px; color:var(--muted); margin-top:6px; line-height:1.6; }
  #report .hist b.ok{ color:var(--ok); }
  #report .fl{ display:inline-block; margin-left:6px; font-size:11.5px; background:#F7E2DE; color:#8A4A40; padding:2px 8px; border-radius:9px; font-weight:400; }
  #report .flags{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  #report .sbtn{ padding:8px 12px; border:none; border-radius:16px; background:#F4F5F3; color:#4F5C56; font-size:12.5px; font-family:inherit; cursor:pointer; }
  #report .errbox{ margin-top:8px; }
  #report .errbox .sbtn{ margin-top:6px; background:#F7E2DE; color:#8A4A40; }
  #report .errdone{ margin-top:8px; font-size:12.5px; color:#8A4A40; }
  #report .rv .choices, #report .rv .ox{ max-width:320px; }
  /* 채점 결과 새 화면(result_view.js — 2026-11-17 디자인) 안에서는 옛 #report 꾸밈을 끈다 */
  body.rvon{ background:#e4efea; }
  #report .rv2 section{ margin:0; }
  #report .rv2 h2{ font-size:20px; margin:0; align-items:baseline; gap:10px; }
  #report .rv2 h2::before{ display:none; }
  #report .rv2 .fixf{ display:flex; flex-direction:column; gap:2px; padding:10px 12px; border-radius:12px; background:#fff; border:1px solid #ecd9dd; }
  #report .rv2 .fixf .lab{ margin:8px 0 4px; }

   * 장애) 옛 백엔드로 폴백. 제출이 원본에 성공하면 시트 사본은 옛 백엔드로 뒤에서 보낸다. */
  const SB_REST = "https://bangdbhqpphqqdwcledg.supabase.co/rest/v1";
  const SB_KEY = "sb_publishable_dE9d1KIbpgYaQkaS2MSrlg_-7SiRJuT";
  async function sbRpc(fn, params){
    const res = await fetch(SB_REST + "/rpc/" + fn, {
      method: "POST",
      headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": "application/json" },
      body: JSON.stringify(params || {})
    });
    if(!res.ok) throw new Error(fn + " " + res.status);
    return res.json();
  }
  function sbMirrorHwork(d, result){
    try{
      const p2 = n => String(n).padStart(2, "0");
      const t = new Date(Date.now() + 9 * 3600000);
      const ts = t.getUTCFullYear() + "-" + p2(t.getUTCMonth()+1) + "-" + p2(t.getUTCDate()) +
                 " " + p2(t.getUTCHours()) + ":" + p2(t.getUTCMinutes());
      // 표에 직접 넣지 않고 '넣기 전용' 함수를 부른다 — 학생이 여는 페이지라
      // 공개 키에 표 권한을 열어 둘 수 없다(013 마이그레이션, 2026-08-25)
      fetch(SB_REST + "/rpc/mirror_hwork_submission", {
        method: "POST",
        headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY,
                   "Content-Type": "application/json" },

          school: d.school || "", grade: d.grade || "", name: d.name || "",
          got: Number(result && result.got) || 0, total: Number(result && result.total) || 0,
          answers: d.answers || {}, detail: (result && result.detail) || {}, questions: d.questions || {} } })
      }).catch(function(e){ console.warn("H WORK 제출 미러 실패 — 일일 점검이 복구", e); });
    }catch(e){}
  }

  let allHw=[];      // [{teacher, code}]
  /* 학생 페이지 [H WORK 풀러 가기]로 연 배정 과제 (2026-11-11 원장님) — 주소의 t·c·nm·sc·gr 로
   * 담당 강사·과제·학교·학년·이름을 고정하고 그 과제 입력 화면만 보여 준다(다시 고르지 않음).
   * done=1 은 이미 제출한 과제 — 이 기기에 오답하기 기록이 있으면 이어 하고, 없으면 새로 받지 않는다. */
  const FX=(function(){
    const q=new URLSearchParams(location.search), c=(q.get('c')||'').trim();
    if(!c) return null;
    return { teacher:(q.get('t')||'').trim(), code:c, name:(q.get('nm')||'').trim(),
             school:(q.get('sc')||'').trim(), grade:(q.get('gr')||'').trim(), done:q.get('done')==='1',
             // 다음에 풀 배정 과제(학생 페이지가 교재 순서로 실어 보냄 — 'teacher\tcode' 줄들, 2026-11-19)
             next:(q.get('nx')||'').split('\n').map(x=>{ const i=x.indexOf('\t'); return i<0?null:{ t:x.slice(0,i).trim(), c:x.slice(i+1).trim() }; })
                  .filter(x=>x&&x.c&&x.c!==c) };
  })();
  let meta=null;     // 선택된 H WORK 메타(정답 없음)
  let QS=null;       // 문항 은행 과제의 문제 화면 {items:{q:{html,pid,src}}, passages:{pid:html}} (067 hwork_qs)
  const CIRC='①②③④⑤';
  const picks={};    // q -> 답
  /* 풀이 시간 기록 (2026-11-18 원장님 "푸는 시간, 화면 밖으로 나간 시간·빈도, 나눠서 풀었다면 중지·재시작 시간") —
   * 화면 이탈 기록(2026-11-12)을 넓혔다. 문항을 연 때부터 제출까지를 '구간'으로 나눠 센다:
   *   구간 = 한 번 앉아서 푼 시간 {s 시작, e 끝, act 화면을 보며 푼 ms, an 화면 밖 횟수, as 화면 밖 ms, end 끝난 까닭}
   *   end — 'pause' [잠시 멈추기] · 'close' 창을 닫음 · 'idle' 화면 밖 10분 넘음(TL_BREAK) · 'submit' 제출
   * 푸는 중의 답·질문 글·구간은 이 기기 localStorage(TL_KEY)에 남겨, 같은 기기에서 과제를 다시 열면 이어 푼다.
   * 제출할 때 time{…}(구간 목록 포함)과 away{n, sec}(합계)를 함께 보낸다 → hwork_submissions.timelog(리포트 078). */
  const TL_BREAK=10*60*1000, TL_KEY='hw_draft_v1', TL_KEEP=14*24*3600*1000;
  const TL={ on:false, sessions:[], cur:null, vis:0, key:'' };
  function tlSum(){
    const ss=TL.sessions; let act=0, an=0, as=0;
    ss.forEach(x=>{ act+=x.act||0; an+=x.an||0; as+=x.as||0; });
    const first=ss.length?ss[0].s:0, last=ss.length?ss[ss.length-1].e:0;
    return { v:1, first, last, span:Math.max(0,Math.round((last-first)/1000)), act:Math.round(act/1000), an, as:Math.round(as/1000),
             breaks:Math.max(0,ss.length-1),
             sessions:ss.map(x=>({ s:x.s, e:x.e, act:Math.round((x.act||0)/1000), an:x.an||0, as:Math.round((x.as||0)/1000), end:x.end||'close' })) };
  }
  function tlFlush(now){ const c=TL.cur; if(!c) return; if(!c.h && TL.vis){ c.act+=now-TL.vis; TL.vis=now; } if(!c.h) c.e=now; }
  function tlOpen(){ const now=Date.now(); TL.cur={ s:now, e:now, act:0, an:0, as:0, h:0, end:'' }; TL.sessions.push(TL.cur); TL.vis=now; TL.on=true; tlSave(); }
  function tlClose(kind){   // 지금 구간을 닫는다 — 화면 밖에 있던 채로 닫히면 나간 때가 끝(그 나감은 화면 밖 횟수에 안 셈)
    const c=TL.cur; if(!c) return; const now=Date.now();
    if(c.h){ c.e=c.h; c.an=Math.max(0,c.an-1); c.h=0; } else tlFlush(now);
    c.end=kind; TL.cur=null; TL.on=false; TL.vis=0;
  }
  function tlVis(){
    if(!TL.on || !TL.cur) return; const c=TL.cur, now=Date.now();
    if(document.visibilityState==='hidden'){ if(!c.h){ tlFlush(now); c.an++; c.h=now; tlSave(); } return; }
    if(!c.h) return;
    const gap=now-c.h;
    if(gap>TL_BREAK){ tlClose('idle'); tlOpen(); toast('10분 넘게 화면 밖에 있어서 새 구간으로 이어서 셉니다'); return; }
    c.as+=gap; c.h=0; c.e=now; TL.vis=now; tlSave();
  }
  document.addEventListener('visibilitychange', tlVis);
  setInterval(function(){ if(TL.on && TL.cur && !TL.cur.h){ tlFlush(Date.now()); tlSave(); } }, 15000);
  window.addEventListener('pagehide', function(){ if(TL.on && TL.cur){ tlClose('close'); tlSave(); } });
  function awayNow(){ const t=tlSum(); return { n:t.an, sec:t.as }; }
  /* 이 기기에 남기는 풀던 기록 — 과제(강사|과제)마다 하나 */
  function tlKey(){ const t=document.getElementById('teacherSel').value, c=document.getElementById('codeSel').value; return t&&c? t+'|'+c : ''; }
  function tlAll(){ try{ return JSON.parse(localStorage.getItem(TL_KEY)||'{}')||{}; }catch(e){ return {}; } }
  function tlPut(all){ try{ localStorage.setItem(TL_KEY, JSON.stringify(all)); }catch(e){} }
  function tlLoad(key){
    const all=tlAll(), now=Date.now(); let ch=false;
    Object.keys(all).forEach(k=>{ if(!all[k]||now-(all[k].saved||0)>TL_KEEP){ delete all[k]; ch=true; } });
    if(ch) tlPut(all);
    const d=all[key]; if(!d||!(d.sessions||[]).length) return null;
    if(FX && FX.name && d.name && d.name!==FX.name) return null;   // 같은 기기를 다른 친구가 쓰면 이어 풀지 않는다
    return d;
  }
  function tlSave(){
    if(!TL.key || !TL.sessions.length) return;
    const all=tlAll();
    all[TL.key]={ saved:Date.now(), name:(document.getElementById('name').value||'').trim(),
      school:document.getElementById('schoolSel').value, grade:document.getElementById('gradeSel').value,
      picks:Object.assign({},picks), notes:Object.assign({},questions),
      sessions:TL.sessions.map(x=>({ s:x.s, e:x.e, act:x.act, an:x.an, as:x.as, h:x.h||0, end:x.end||'' })) };
    tlPut(all);
  }
  function tlDrop(key){ const all=tlAll(); if(all[key]){ delete all[key]; tlPut(all); } }
  function tlReset(){ TL.on=false; TL.cur=null; TL.vis=0; TL.sessions=[]; TL.key=''; }
  const questions={};// q -> 질문 내용

  function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show');
    clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }
  function showErr(m){ const d=document.getElementById('topErr'); d.style.display='block'; d.textContent=m; }
  function uniq(a){ return [...new Set(a)]; }

  // 일시적 오류(콜드 스타트·네트워크 흔들림·비정상 응답) 시 자동으로 다시 시도 (불러오기 전용)
  async function fetchJSON(url, tries){
    tries = tries || 3;
    let lastErr;
    for(let i=0;i<tries;i++){
      try{
        const res = await fetch(url, { cache:'no-store' });
        const text = await res.text();
        try{ return JSON.parse(text); }
        catch(e){ lastErr = new Error('서버가 일시적으로 비정상 응답을 보냈습니다'); }
      }catch(e){ lastErr = e; }
      if(i < tries-1) await new Promise(r=>setTimeout(r, 700*(i+1)));
    }
    throw lastErr || new Error('요청 실패');
  }

  async function init(){
    try{
      let json;
      try{ json=await sbRpc('hwork_list'); }
      catch(e){ console.warn('수파베이스 목록 실패 — 기존 백엔드로 폴백', e);
        json=await fetchJSON(API_URL+'?action=list'); }
      if(!json.ok){ showErr('목록을 불러오지 못했습니다: '+(json.error||'')); return; }
      allHw=json.list||[];
      const teachers=uniq(allHw.map(h=>h.teacher));
      const sel=document.getElementById('teacherSel');
      if(!teachers.length){ sel.innerHTML='<option value="">등록된 H WORK이 없습니다</option>'; return; }
      sel.innerHTML='<option value="">담당 강사 선택</option>'+teachers.map(t=>`<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
      if(FX) initFixed();
    }catch(err){ showErr('서버 연결에 실패했습니다. 인터넷 연결을 확인해 주세요.\n('+err+')'); }
  }

  /* 학교 이름 비교 — '무원고' = '무원고등학교', '서정중' = '서정중학교' */
  function schKey(s){ return String(s||'').replace(/\s+/g,'').replace(/등학교$/,'').replace(/학교$/,''); }
  function optOnly(id, v, label){
    const el=document.getElementById(id);
    el.innerHTML=`<option value="${escapeHtml(v)}">${escapeHtml(label||v)}</option>`; el.value=v; el.disabled=true;
  }
  async function initFixed(){
    const hw=allHw.find(h=>h.code===FX.code && (!FX.teacher || h.teacher===FX.teacher))
          || allHw.find(h=>h.code===FX.code);
    document.querySelector('.title-bar').textContent='배정 과제 풀기';
    if(!hw){
      document.getElementById('infoCard').style.display='none';
      document.getElementById('footer').style.display='none';
      showErr('배정된 H WORK을 찾을 수 없습니다.\n'+(FX.teacher?FX.teacher+' · ':'')+FX.code
        +'\n\n과제 이름이 바뀌었거나 지워졌을 수 있습니다. 이 화면을 선생님께 보여 주세요.');
      return;
    }
    FX.teacher=hw.teacher;
    optOnly('teacherSel', hw.teacher); optOnly('codeSel', hw.code);
    const gSel=document.getElementById('gradeSel');
    if(FX.grade && [...gSel.options].some(o=>o.value===FX.grade)){ gSel.value=FX.grade; gSel.disabled=true; }
    if(FX.name){ const n=document.getElementById('name'); n.value=FX.name; n.readOnly=true; }
    drawFixed();
    // 이 기기에 같은 과제의 오답하기가 남아 있으면 그것부터 이어 한다
    const left=rsList().find(x=>x.code===hw.code && (!FX.name || x.name===FX.name));
    if(left && await resumeOne(Number(left.id), String(left.key))) return;
    if(FX.done){
      document.getElementById('footer').style.display='none';
      document.querySelector('.progress-wrap').style.display='none';
      const n=document.getElementById('topErr'); n.className='notice'; n.style.display='block';
      n.textContent='이미 제출한 과제입니다. 오답하기는 제출한 기기에서 이어 할 수 있어요.';
      return;
    }
    if(hw.closed){ showErr('마감된 과제입니다. 선생님께 문의해 주세요.'); document.getElementById('footer').style.display='none'; return; }
    onCode();
  }
  function lockSchool(){
    const sSel=document.getElementById('schoolSel');
    if(!FX.school) return;
    const hit=[...sSel.options].find(o=>o.value && o.value!=='__OTHER__' && schKey(o.value)===schKey(FX.school));
    if(hit) optOnly('schoolSel', hit.value);
    else optOnly('schoolSel', FX.school);
    document.getElementById('schoolOther').style.display='none';
    drawFixed();
  }
  /* 고정된 값이 모두 있으면 고르기 칸 대신 한 장으로 보여 준다 */
  function drawFixed(){
    const box=document.getElementById('fixedBox');
    const school=document.getElementById('schoolSel').value||FX.school;
    const grade=document.getElementById('gradeSel').value, name=document.getElementById('name').value;
    const full=FX.name && school && grade && document.getElementById('gradeSel').disabled;
    document.getElementById('pickBox').style.display=full?'none':'block';
    box.style.display='block';
    const row=(k,v,c)=>`<div class="frow"><span class="fk">${k}</span><span class="fv${c?' '+c:''}">${escapeHtml(v||'')}</span></div>`;
    box.innerHTML=row('과제', FX.code, 'code')+row('담당 강사', FX.teacher)
      +(full? row('학교', school)+row('학년', grade)+row('이름', name) : '')
      +'<div class="fnote">학생 페이지에서 연 배정 과제라 바꿀 수 없습니다. 아래에서 답안만 입력하세요.</div>';
  }

  function onTeacher(){
    const t=document.getElementById('teacherSel').value;
    const codeSel=document.getElementById('codeSel');
    resetAfterCode();
    if(!t){ codeSel.disabled=true; codeSel.innerHTML='<option value="">먼저 담당 강사를 고르세요</option>'; return; }
    // 마감된 과제는 고를 수 없게 (마감일 밤 11:59까지 제출 가능)
    const hws=allHw.filter(h=>h.teacher===t);
    codeSel.disabled=false;
    codeSel.innerHTML='<option value="">H WORK 선택</option>'+hws.map(h=>
      h.closed
        ? `<option value="" disabled>${escapeHtml(h.code)} (마감)</option>`
        : `<option value="${escapeHtml(h.code)}">${escapeHtml(h.code)}</option>`
    ).join('');
  }

  function resetAfterCode(){
    if(TL.on){ tlClose('close'); tlSave(); }
    tlReset(); showPause(false);
    meta=null;
    for(const k in picks) delete picks[k];
    for(const k in questions) delete questions[k];
    document.getElementById('quiz').innerHTML='';
    const sSel=document.getElementById('schoolSel');
    sSel.disabled=true; sSel.innerHTML='<option value="">먼저 H WORK을 고르세요</option>';
    document.getElementById('schoolOther').style.display='none';
    document.getElementById('tot').textContent='0';
    updateProgress();
  }

  async function onCode(){
    const teacher=document.getElementById('teacherSel').value;
    const code=document.getElementById('codeSel').value;
    resetAfterCode();
    if(!code) return;
    toast('불러오는 중…');
    try{
      let json;
      try{ json=await sbRpc('hwork_meta', { p:{ teacher:teacher, code:code } }); }
      catch(e){ console.warn('수파베이스 문항 조회 실패 — 기존 백엔드로 폴백', e);
        json=await fetchJSON(API_URL+'?action=meta&teacher='+encodeURIComponent(teacher)+'&code='+encodeURIComponent(code)); }
      if(!json.ok){ showErr('H WORK을 불러오지 못했습니다: '+(json.error||'')); return; }
      if(json.meta && json.meta.closed){ showErr('마감된 과제입니다 (마감 '+json.meta.due+'). 선생님께 문의해 주세요.'); return; }
      meta=json.meta;
      QS=null;
      if(meta.bank){   // 문항 은행 과제 — 문제를 화면에 띄운다(정답·해설은 오지 않음)
        try{ const qj=await sbRpc('hwork_qs', { p:{ teacher:teacher, code:code } }); if(qj.ok) QS=qj; }catch(e){}
        if(!QS){ showErr('문제를 불러오지 못했습니다. 잠시 뒤 과제를 다시 골라 주세요.'); return; }
      }
      fillSchools(meta.schools||[]);
      if(FX) lockSchool();
      buildQuiz(meta);
    }catch(err){ showErr('서버 연결 실패: '+err); }
  }

  function fillSchools(schools){
    const sel=document.getElementById('schoolSel');
    sel.disabled=false;
    sel.innerHTML='<option value="">학교 선택</option>'
      + schools.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('')
      + '<option value="__OTHER__">명단에 없음 (직접 입력)</option>';
    document.getElementById('schoolOther').style.display='none';
  }
  function onSchool(){
    const v=document.getElementById('schoolSel').value;
    document.getElementById('schoolOther').style.display = (v==='__OTHER__')?'block':'none';
  }

  function buildQuiz(meta){
    const quiz=document.getElementById('quiz');
    quiz.innerHTML='';
    const dr=tlKey()?tlLoad(tlKey()):null;
    quiz.insertAdjacentHTML('beforeend', dndHtml(dr));
    quiz.insertAdjacentHTML('beforeend', '<div class="paused" id="pausedBox" style="display:none"></div>');
    const wrap=document.createElement('div'); wrap.id='qwrap'; wrap.style.display='none';
    const label=document.createElement('div');
    label.className='sec-label';
    label.textContent=`전체 ${meta.count}문항`;
    wrap.appendChild(label);
    for(let q=1;q<=meta.count;q++){
      const type=(meta.items[q]&&meta.items[q].type)||'choice5';
      const pb=passageBlock(q); if(pb) wrap.appendChild(pb);
      wrap.appendChild(makeQ(q,type));
    }
    quiz.appendChild(wrap);
    document.getElementById('omr').innerHTML=Array.from({length:meta.count},(_,i)=>{ const q=i+1, t=(meta.items[q]&&meta.items[q].type)||'choice5';
      return `<button type="button" id="om${q}" class="${t==='essay'?'essay':''}" onclick="omrGo(${q})">${q}</button>`; }).join('');
    document.getElementById('tot').textContent=meta.count;
    updateProgress();
  }
  /* 방해 금지 모드 안내 (2026-11-12 원장님) — 웹페이지는 휴대폰 알림을 막을 수 없어 학생이 직접 켜도록 안내한다.
   * [방해 금지를 켰어요]를 눌러야 문항이 열리고, 그때부터 화면 이탈을 센다(켰는지는 확인할 수 없다). */
  function fmtHM(ms){ const d=new Date(ms); const h=d.getHours(), m=d.getMinutes(); return (h<12?'오전 ':'오후 ')+((h%12)||12)+':'+String(m).padStart(2,'0'); }
  function fmtMD(ms){ const d=new Date(ms); return (d.getMonth()+1)+'/'+d.getDate()+' ('+'일월화수목금토'[d.getDay()]+')'; }
  function fmtDur(sec){ sec=Math.max(0,Math.round(Number(sec)||0)); if(sec<60) return sec+'초'; const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60); return (h?h+'시간 ':'')+(m?m+'분':(h?'':'0분')); }
  function dndHtml(dr){
    const ua=navigator.userAgent||'';
    const ios=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1), and=/Android/.test(ua);
    const iosL='<li class="'+(ios?'me':'')+'"><b>아이폰</b> 화면 오른쪽 위에서 아래로 내려 제어 센터를 열고 <b>집중 모드 → 방해 금지</b>를 누릅니다.</li>';
    const andL='<li class="'+(and?'me':'')+'"><b>갤럭시</b> 화면 위에서 아래로 두 번 내려 빠른 설정을 열고 <b>방해 금지</b>를 누릅니다.</li>';
    return `<div class="dnd" id="dndBox">
      <div class="dnd-h">시작하기 전에 방해 금지 모드를 켜 주세요</div>
      <p class="dnd-p">푸는 동안 다른 알림이 뜨지 않게 휴대폰에서 직접 켜야 합니다.</p>
      <ol class="dnd-l">${and&&!ios? andL+iosL : iosL+andL}</ol>
      <p class="dnd-n">푸는 시간, 화면 밖으로 나간 횟수와 시간, 나눠서 푼 때의 멈춘 시각·다시 시작한 시각이 기록됩니다. 제출하면 결과 화면에서 나도 볼 수 있어요. <a href="hwork_time_guide.html" target="_blank" rel="noopener">풀이 시간 기록 안내 보기</a></p>
      ${dr?`<div class="dnd-re"><b>이 기기에 풀던 기록이 있습니다.</b> ${escapeHtml(dr.name||'')}${dr.name?' · ':''}${fmtMD(dr.sessions[dr.sessions.length-1].e)} ${fmtHM(dr.sessions[dr.sessions.length-1].e)}까지 · 답 ${Object.keys(dr.picks||{}).length}개 · ${dr.sessions.length}번 나눠 풂</div>
      <button type="button" class="dnd-go" onclick="dndGo(true)">방해 금지를 켰어요 · 이어 풀기</button>
      <button type="button" class="dnd-new" onclick="if(confirm('풀던 답과 시간 기록을 지우고 처음부터 풀까요?'))dndGo(false)">처음부터 다시 풀기</button>`
      :`<button type="button" class="dnd-go" onclick="dndGo(false)">방해 금지를 켰어요 · 문제 풀기 시작</button>`}
      <p class="dnd-n">다 풀고 나면 방해 금지를 다시 꺼 주세요.</p>
    </div>`;
  }
  function dndGo(resume){
    const b=document.getElementById('dndBox'); if(b) b.style.display='none';
    const w=document.getElementById('qwrap'); if(w) w.style.display='';
    tlReset(); TL.key=tlKey();
    const dr=resume&&TL.key?tlLoad(TL.key):null;
    if(dr){
      TL.sessions=(dr.sessions||[]).map(x=>{ const o={ s:x.s, e:x.e, act:x.act||0, an:x.an||0, as:x.as||0, h:x.h||0, end:x.end||'' };
        if(!o.end){ if(o.h){ o.e=o.h; o.an=Math.max(0,o.an-1); } o.end='close'; } o.h=0; return o; });
      restorePicks(dr);
      toast('풀던 곳부터 이어서 풉니다');
    }else if(TL.key) tlDrop(TL.key);
    tlOpen(); showPause(true);
  }
  function restorePicks(dr){   // 이 기기에 남은 답·질문 글을 화면에 다시 채운다
    const nm=document.getElementById('name'); if(dr.name && !nm.value && !nm.readOnly) nm.value=dr.name;
    Object.keys(dr.picks||{}).forEach(q=>{ const v=dr.picks[q], box=document.getElementById('q'+q); if(!box) return;
      const t=(meta.items[q]&&meta.items[q].type)||'choice5';
      if(t==='choice5'){ const btn=box.querySelectorAll('.choices button')[Number(v)-1]; if(btn && !btn.classList.contains('sel')) pickChoice(Number(q), Number(v), btn); }
      else if(t==='ox'){ const btn=[...box.querySelectorAll('.ox button')].find(b=>b.textContent.trim().charAt(0)===v); if(btn && !btn.classList.contains('sel')) pickOX(Number(q), v, btn); }
      else { const el=box.querySelector('textarea.eans, input.tans'); if(el){ el.value=v; pickText(Number(q), v); } } });
    Object.keys(dr.notes||{}).forEach(q=>{ const t=document.getElementById('note'+q); if(t){ t.value=dr.notes[q]; t.style.display='block'; setNote(Number(q), dr.notes[q]); } });
  }
  function showPause(on){ const b=document.getElementById('pauseBtn'); if(b) b.style.display=on?'':'none'; }
  /* [잠시 멈추기] — 지금 구간을 닫고 답·시간을 이 기기에 남긴다. 다시 풀기를 누르면 새 구간 */
  function tlPause(){
    if(!TL.on) return;
    tlClose('pause'); tlSave();
    const w=document.getElementById('qwrap'); if(w) w.style.display='none';
    const box=document.getElementById('pausedBox'), t=tlSum();
    box.innerHTML=`<div class="ph">잠시 멈췄습니다 · ${fmtHM(Date.now())}</div>
      <p>지금까지 ${fmtDur(t.act)} 동안 풀었고, 답 ${Object.keys(picks).length}개를 이 기기에 저장했습니다.</p>
      <p class="pn">지금 다시 풀어도 되고, 나중에 <b>이 기기</b>에서 같은 과제를 열면 이어 풀 수 있어요. 다른 기기에서는 이어지지 않아요.</p>
      <button type="button" class="dnd-go" onclick="tlResume()">다시 풀기</button>`;
    box.style.display=''; showPause(false); window.scrollTo({top:document.getElementById('quiz').offsetTop-80,behavior:'smooth'});
  }
  function tlResume(){
    const box=document.getElementById('pausedBox'); box.style.display='none'; box.innerHTML='';
    const w=document.getElementById('qwrap'); if(w) w.style.display='';
    tlOpen(); showPause(true);
  }

  /* 문항 은행 — 같은 지문 문항이 시작되는 자리에 지문을 한 번 띄운다 '[03~05] 다음 글을 읽고 물음에 답하시오.' */
  function pidOf(q){ const it=QS&&QS.items&&QS.items[q]; return it?it.pid||'':''; }
  function pidRange(q){ const p=pidOf(q); let a=q,b=q; while(a>1&&pidOf(a-1)===p) a--; while(QS.items[b+1]&&pidOf(b+1)===p) b++; return [a,b]; }
  function qCls(){ return QS&&QS.style==='real'?'rq':'gq'; }   // 068 — 이미 낸 교재 과제(SHUEGUK REAL)는 교재 모양
  function pasHtml(q){
    const p=pidOf(q); if(!p) return '';
    const [a,b]=pidRange(q), r=a===b?String(a):a+'~'+b;
    return `<div class="${qCls()}"><div class="ph"><span class="prng">[${r}]</span> 다음 글을 읽고 물음에 답하시오.</div>${(QS.passages||{})[p]||''}</div>`;
  }
  function passageBlock(q){
    if(!QS || !pidOf(q) || pidOf(q-1)===pidOf(q)) return null;
    const d=document.createElement('div'); d.className='gqp'; d.innerHTML=pasHtml(q); return d;
  }
  function qHtml(q){ const it=QS&&QS.items&&QS.items[q]; return it?`<div class="${qCls()}">${it.html}</div>`:''; }
  function makeQ(q,type){
    const div=document.createElement('div');
    div.className='q'+(qHtml(q)?' bank':''); div.id='q'+q;
    let body='';
    const tlabel = type==='ox'?'OX':(type==='essay'?'서술형 · 채점 없이 예시 답과 비교':(type==='text'?'단답형':'5지선다'));
    if(type==='choice5'){
      body='<div class="qtype">'+tlabel+'</div><div class="pickh" id="ph'+q+'">답을 하나 누르세요</div><div class="choices">';
      for(let j=1;j<=5;j++) body+=`<button type="button" aria-label="${j}번" onclick="pickChoice(${q},${j},this)">${CIRC[j-1]}</button>`;
      body+='</div>';
    }else if(type==='ox'){
      body=`<div class="qtype">${tlabel}</div><div class="pickh" id="ph${q}">맞으면 O, 틀리면 X 를 누르세요</div><div class="ox">
        <button type="button" onclick="pickOX(${q},'O',this)">O<small>맞다</small></button>
        <button type="button" onclick="pickOX(${q},'X',this)">X<small>틀리다</small></button></div>`;
    }else if(type==='essay'){
      body=`<div class="qtype">${tlabel}</div><textarea class="eans" placeholder="답안을 적어 주세요. 제출하면 예시 답과 비교할 수 있어요." oninput="pickText(${q},this.value)"></textarea>`;
    }else{
      body=`<div class="qtype">${tlabel}</div><input type="text" class="tans" placeholder="답 입력" oninput="pickText(${q},this.value)">`;
    }
    div.innerHTML=`<span class="num">${q}</span><div class="qbody">${qHtml(q)}${body}
      <button type="button" class="qask" id="ask${q}" onclick="toggleAsk(${q})">질문</button>
      <textarea class="qnote" id="note${q}" placeholder="이 문항에 대해 궁금한 점을 적어 주세요" oninput="setNote(${q},this.value)" style="display:none;"></textarea></div>`;
    return div;
  }

  function pickMark(q, v, btn, label){   // 같은 칸을 다시 누르면 지운다
    const wrap=btn.parentElement, again=btn.classList.contains('sel');
    wrap.querySelectorAll('button').forEach(b=>b.classList.remove('sel'));
    if(again) delete picks[q]; else { picks[q]=v; btn.classList.add('sel'); }
    if(TL.on) tlSave();
    document.getElementById('q'+q).classList.toggle('answered', !again);
    const h=document.getElementById('ph'+q);
    if(h) h.innerHTML = again ? (label==null?'맞으면 O, 틀리면 X 를 누르세요':'답을 하나 누르세요') : '<b>'+(label||v)+' 골랐어요</b> · 다시 누르면 지워요';
    updateProgress();
  }
  function pickChoice(q,j,btn){ pickMark(q, j, btn, CIRC[j-1]); }
  function pickOX(q,v,btn){ pickMark(q, v, btn, null); }
  function omrGo(q){ const el=document.getElementById('q'+q); if(el) el.scrollIntoView({ behavior:'smooth', block:'start' }); }
  function pickText(q,v){
    const val=v.trim();
    if(val) picks[q]=val; else delete picks[q];
    if(TL.on) tlSave();
    document.getElementById('q'+q).classList.toggle('answered', !!val);
    updateProgress();
  }

  function toggleAsk(q){
    const t=document.getElementById('note'+q);
    const show = (t.style.display==='none' || !t.style.display);
    t.style.display = show ? 'block' : 'none';
    if(show) t.focus();
  }
  function setNote(q,v){
    const val=v.trim();
    if(val) questions[q]=val; else delete questions[q];
    if(TL.on) tlSave();
    document.getElementById('ask'+q).classList.toggle('has', !!val);
  }

  function updateProgress(){
    const total=meta?meta.count:0;
    const n=Object.keys(picks).length;
    document.getElementById('cnt').textContent=n;
    document.getElementById('barFill').style.width=(total? n/total*100:0)+'%';
    for(let q=1;q<=total;q++){ const b=document.getElementById('om'+q); if(!b) continue; const v=picks[q], on=v!=null&&v!=='';
      b.classList.toggle('on', on); b.innerHTML = on && (typeof v==='number' || v==='O' || v==='X') ? q+'<b>'+(typeof v==='number'?CIRC[v-1]:v)+'</b>' : (on?q+'<b>✓</b>':String(q)); }
  }

  async function submit(){
    if(!meta){ toast('H WORK을 선택해 주세요'); return; }
    const teacher=document.getElementById('teacherSel').value;
    const code=document.getElementById('codeSel').value;
    const grade=document.getElementById('gradeSel').value;
    const name=document.getElementById('name').value.trim();
    let school=document.getElementById('schoolSel').value;
    if(school==='__OTHER__') school=document.getElementById('schoolOther').value.trim()||'명단에 없음';

    if(!school){ toast('학교를 선택해 주세요'); window.scrollTo({top:0,behavior:'smooth'}); return; }
    if(!grade){ toast('학년을 선택해 주세요'); window.scrollTo({top:0,behavior:'smooth'}); return; }
    if(!name){ toast('이름을 입력해 주세요'); document.getElementById('name').focus(); return; }

    const qw=document.getElementById('qwrap');
    if(qw && qw.style.display==='none' && TL.sessions.length && !TL.on){ toast('[다시 풀기]를 누른 뒤 제출해 주세요'); return; }
    if(qw && qw.style.display==='none'){ toast('먼저 [방해 금지를 켰어요]를 눌러 문제를 열어 주세요'); document.getElementById('dndBox').scrollIntoView({behavior:'smooth',block:'center'}); return; }
    const missing=[];
    for(let q=1;q<=meta.count;q++) if(picks[q]==null) missing.push(q);
    if(missing.length && !confirm(`미응답 ${missing.length}문항이 있습니다 (${missing.slice(0,5).join(', ')}${missing.length>5?'…':''}).\n그대로 제출할까요?`)) return;

    if(TL.cur) tlFlush(Date.now());
    const tsum=tlSum(); if(tsum.sessions.length) tsum.sessions[tsum.sessions.length-1].end='submit';
    const payload={ action:'submit', data:{ teacher, code, school, grade, name, answers:picks, questions:questions, away:{ n:tsum.an, sec:tsum.as }, time:tsum } };
    const btn=document.getElementById('submit'); btn.disabled=true; btn.textContent='채점 중…';
    function showFail(json){ btn.disabled=false; btn.textContent='제출하기'; toast('채점 오류: '+((json&&json.error)||'알 수 없음')); }
    // 원본(수파베이스)에 먼저 제출·채점 — 성공하면 시트 사본은 옛 백엔드로 뒤에서(결과 무시,
    // 빠지면 일일 점검이 보고). 함수 호출 자체가 실패하면(마이그레이션 전·장애) 옛 경로 그대로.
    try{
      const json=await sbRpc('hwork_submit', { p: payload.data });
      if(json.ok){
        fetch(API_URL,{ method:'POST', body:JSON.stringify(payload) }).catch(function(){});
        tlDone(tsum); renderReport(json);
      }
      else showFail(json);   // 마감 등 판정 거절 — 옛 백엔드도 같은 판정이라 폴백하지 않는다
      return;
    }catch(err){ console.warn('수파베이스 제출 실패 — 기존 백엔드로 폴백', err); }
    try{
      const res=await fetch(API_URL,{ method:'POST', body:JSON.stringify(payload) });
      const json=await res.json();
      if(json.ok){ tlDone(tsum); sbMirrorHwork(payload.data, json.result); renderReport(json); }
      else showFail(json);
    }catch(err){ btn.disabled=false; btn.textContent='제출하기'; toast('제출 실패: 다시 시도해 주세요'); }
  }

  let TL_LAST=null;   // 방금 낸 과제의 시간 기록 — 결과 화면에 바로 보여 준다
  function tlDone(tsum){ if(TL.cur) tlClose('submit'); if(TL.key) tlDrop(TL.key); tlReset(); showPause(false); TL_LAST=tsum; }
  /* 결과의 전체 문항 수 — 서술형(essay)은 채점 문항 수(total)에서 빠지므로 count·detail 로 센다 */
  function itemCount(r){
    let n=Math.max(Number(r.count)||0, Number(r.total)||0);
    Object.keys(r.detail||{}).forEach(k=>{ const v=Number(k); if(v>n) n=v; });
    return n;
  }
  /* ── 결과 · 오답하기 (2026-11-11 원장님 — 리포트 마이그레이션 064·065) ──
   * 1차 결과는 O·X만 — 틀린 문항 정답은 서버가 감춰서 보낸다.
   * 틀린 문항(서술형 제외)마다 오답하기: ① 내가 틀린 답을 고른 이유 ② 다시 고른 답 ③ 이 답이 정답인 이유
   * → [재채점](hwork_fix) → 맞으면 클리어(그 문항 정답 공개), 틀리면 그 답이 새 틀린 답이 되어 ①부터 다시.
   * 문항마다 [왜 틀렸는지 모르겠어요 · 선생님 도와주세요]·[문항 오류 신고](내용 필수) — hwork_flag.
   * 모든 문항이 클리어되거나 선생님께 넘겨지면 끝. 별은 주지 않는다.
   * 제출 응답에 id·key 가 있을 때만(수파베이스 경로). 옛 백엔드 폴백은 종전처럼 정답까지 바로 보인다.
   * id·key 는 이 기기 localStorage(RS_KEY)에 남겨 창을 닫았다 와도 이어 한다. */
  const RS_KEY='hw_retry_v1';
  let RS=null;   // {id,key,stage,st,got,total,count,detail,review,answers, draft:{q:{ww,pick,wr,err,errOpen}}}
  function rsList(){ try{ return JSON.parse(localStorage.getItem(RS_KEY)||'[]')||[]; }catch(e){ return []; } }
  function rsSave(list){ try{ localStorage.setItem(RS_KEY, JSON.stringify(list.slice(0,10))); }catch(e){} }
  function rsRemember(){
    if(!RS||!RS.id) return;
    const list=rsList().filter(x=>x.id!==RS.id);
    if(RS.stage!=='done') list.unshift({ id:RS.id, key:RS.key, code:RS.st.code, name:RS.st.name, at:Date.now() });
    rsSave(list);
  }
  function wrongQs(){ return Object.keys(RS.detail||{}).filter(k=>RS.detail[k]&&RS.detail[k].ok===false).map(Number).sort((a,b)=>a-b); }
  function rvOf(q){ return (RS.review&&RS.review[q])||{ tries:[] }; }
  function isCleared(q){ return !!rvOf(q).cleared_at; }
  function isHanded(q){ const r=rvOf(q); return !!(r.cleared_at||r.help||r.error); }
  function curWrong(q){ const t=rvOf(q).tries||[]; return t.length? t[t.length-1].pick : ((RS.detail[q]||{}).mine||''); }
  function calcStage(){ if(!RS.id) return 'legacy'; return wrongQs().every(isHanded)?'done':'fix'; }

  function renderReport(res){
    const r=res.result||{};
    RS={ id:res.id||null, key:res.key||null, st:res.student||{}, got:r.got, total:r.total, count:r.count,
         detail:r.detail||{}, review:null, answers:{}, draft:{}, qa:[], ui:null, time:TL_LAST };
    RS.stage=calcStage();
    rsRemember(); drawReport(); window.scrollTo(0,0); qaLoad();
    if(RS.stage==='done' || (RS.stage==='legacy' && RS.total>0 && RS.got>=RS.total)) setTimeout(clearShow, 450);
  }
  function fromState(id, key, s){
    RS={ id, key, st:{ teacher:s.teacher, code:s.code, name:s.name, school:'', grade:'' }, got:s.got, total:s.total,
         count:null, detail:s.detail||{}, review:s.review||null, answers:s.answers||{}, draft:{}, qa:[], ui:null,
         checked:s.checked||{}, checkDone:s.check_done||null, checkSeen:s.check_seen_at||'',
         time:s.time||null, away:Number(s.away_n)>0?{ n:Number(s.away_n), sec:Number(s.away_sec)||0 }:null };
    RS.stage=calcStage();
    rsRemember(); drawReport(); window.scrollTo(0,0);
    // 하트 팝업은 답장 목록을 받은 뒤에 — '질문에 답장이 왔습니다'를 함께 알리려고 (2026-11-17 원장님)
    Promise.race([qaLoad(s.teacher, s.code), new Promise(r=>setTimeout(r,2500))]).then(heartMaybe, heartMaybe);
  }
  function ansOf(q, d){
    if(d.ok!==false || RS.stage==='legacy') return escapeHtml(d.ans||'');
    if(RS.answers && RS.answers[q]!=null) return `<b class="reveal">${escapeHtml(RS.answers[q])}</b>`;
    return '<span class="hide">오답하기로 찾아보세요</span>';
  }
  function fixCell(q){
    const r=rvOf(q), n=(r.tries||[]).length, tags=[];
    if(r.cleared_at) tags.push(`<span class="o">클리어</span><div class="m2">${n}번째에</div>`);
    else if(n) tags.push(`<span class="x">진행 중</span><div class="m2">${n}번 시도</div>`);
    if(r.help) tags.push('<div class="m2 flag">도움 요청</div>');
    if(r.error) tags.push('<div class="m2 flag">오류 신고</div>');
    return `<td>${tags.join('')}</td>`;
  }
  function drawReport(){   // 채점 결과 — 선생님과 같은 화면(result_view.js, 2026-11-17 디자인)
    const st=RS.st||{};
    const n=itemCount({ count:RS.count, total:RS.total, detail:RS.detail });
    const ne=Object.keys(RS.detail||{}).filter(q=>(RS.detail[q]||{}).type==='essay').length;
    const ctx={ mode:'student', st:{ name:st.name, school:st.school, grade:st.grade, teacher:st.teacher, code:st.code },
      got:RS.got||0, total:RS.total||0, n, detail:RS.detail||{}, review:RS.review||{}, answers:RS.answers||{}, qa:RS.qa||[],
      checked:RS.checked||{}, checkDone:RS.checkDone||null, time:RS.time||null, away:RS.away||null,
      note:(ne?'서술형 '+ne+'문항은 점수에 넣지 않았습니다. 문항을 눌러 예시 답과 비교해 보세요. ':'')+(RS.id?'궁금한 문항은 카드를 눌러 선생님께 바로 질문할 수 있어요. 답장이 오면 그 문항에 표시돼요.':''),
      ui:RS.ui||null,
      hooks:{
        qhtml:q=>QS&&qHtml(q)?{ pas:pidOf(q)?pasHtml(q):'', html:qHtml(q) }:null,
        fixForm:q=>fixForm(q),
        expl:q=>{ const d=RS.detail[q]||{}, r=rvOf(q); if(!QS||!RS.id) return '';
          if(d.ok===true||r.cleared_at) return `<div id="ex${q}"><button type="button" class="sub" onclick="qaExpl(${q})">${qCls()==='rq'?'정답 보기':'해설 보기'}</button></div>`; return ''; },
        composer:q=>{ if(!RS.id) return ''; const d=RS.detail[q]||{}, r=rvOf(q), un=d.ok===false&&!r.cleared_at;
          // 선생님 답장이 마지막이면 — [이해했어요 · 클리어] / [다시 질문하기] (2026-11-17 원장님)
          const ms=(RS.qa||[]).filter(m=>String(m.q)===String(q)), last=ms[ms.length-1], lt=last?String(last.at||'').slice(0,16):'';
          const und=r.understood_at && lt<=String(r.understood_at);
          const ask=(lab)=>`<div class="cmp"><span class="lab">${lab}</span>
            <textarea id="qaIn${q}" maxlength="1000" placeholder="어디가 헷갈렸는지, 왜 그 답을 골랐는지 적어 주세요."></textarea>
            <button type="button" class="go" id="qaGo${q}" onclick="qaSend(${q})">선생님께 보내기</button>
            <span class="tip">문항 번호와 내가 고른 답이 함께 갑니다. 선생님 답장은 이 문항에 바로 보여요.</span></div>`;
          if(RS.reask&&RS.reask[q]) return ask('다시 질문하기 · 아직 헷갈리는 곳을 적어 주세요');
          if(last && last.who==='선생님' && !und) return `<div class="ack2"><span class="q2">선생님 답장을 보고 이해가 되었나요?</span><div class="bb">
              <button type="button" class="yes" id="qaOk${q}" onclick="qaClear(${q})">${un?'이해했어요 · 클리어':'이해했어요'}</button>
              <button type="button" class="no" onclick="qaReask(${q})">다시 질문하기</button></div></div>`;
          if(und) return `<button type="button" class="reask" onclick="qaReask(${q})">아직 궁금한 게 있어요 · 다시 질문하기</button>`;
          return ask('선생님께 질문하기'); },
        files:f=>rfHtml(f),
        opened:q=>{ (RS.seen=RS.seen||{})[q]=true; (RS.qa||[]).forEach(m=>{ if(String(m.q)===String(q)&&m.who==='선생님') m.read=true; }); },
        after:()=>rfThumbs()
      } };
    if(!ctx.ui){ ctx.ui={ filter:'전체', open:RV.openDefault(ctx) }; RS.ui=ctx.ui; }
    RV.draw(document.getElementById('report'), ctx);
    document.getElementById('main').style.display='none';
    document.getElementById('footer').style.display='none';
    document.getElementById('report').style.display='block';
    document.body.classList.add('rvon');
  }
  /* 문항 카드 안 오답하기 칸 — 클리어 전 오답만 */
  function fixForm(q){
    const d=RS.detail[q]||{}, r=rvOf(q), dr=RS.draft[q]||{};
    if(RS.stage==='legacy' || d.ok!==false || d.type==='essay' || r.cleared_at) return '';
    const w=curWrong(q);
    const errBox = r.error ? ''
      : `<div class="errbox" style="display:${dr.errOpen?'block':'none'};"><textarea class="fix" data-f="err" maxlength="300" placeholder="어디가 잘못된 것 같은지 적어 주세요. (예: 정답이 ③도 맞는 것 같아요)" oninput="setDraft(${q},'err',this.value)">${escapeHtml(dr.err||'')}</textarea>
          <button type="button" class="sbtn" onclick="sendFlag(${q},'error')">오류 신고 보내기</button></div>`;
    return `<div class="fixf" id="rv${q}"><span class="fh">오답하기 · 세 칸을 채우고 재채점을 누르세요. 맞으면 클리어, 정답이 보여요.</span>
      <div class="lab">① 내가 틀린 답(${escapeHtml(w||'무응답')})을 고른 이유</div>
      <textarea class="fix" data-f="ww" maxlength="300" placeholder="그 답을 왜 골랐는지 그때 생각을 적어 보세요." oninput="setDraft(${q},'ww',this.value)">${escapeHtml(dr.ww||'')}</textarea>
      <div class="lab">② 다시 고른 답</div>${pickInput(q, d.type||'choice5', dr.pick)}
      <div class="lab">③ 이 답이 정답인 이유</div>
      <textarea class="fix" data-f="wr" maxlength="300" placeholder="이 답이 왜 맞는지 근거를 찾아 적어 보세요." oninput="setDraft(${q},'wr',this.value)">${escapeHtml(dr.wr||'')}</textarea>
      <button type="button" class="stepbtn" id="fixBtn${q}" onclick="sendFix(${q})">재채점</button>
      <div class="flags">${r.error?'':`<button type="button" class="sbtn" onclick="toggleErr(${q})">문항 오류 신고</button>`}</div>${errBox}</div>`;
  }

  /* 오답하기 상자 */
  function fixHtml(wq, nc){
    if(!wq.length) return '';
    const head = RS.stage==='done'
      ? `<div class="guide">오답하기를 마쳤습니다. 선생님께 넘긴 문항은 수업 시간에 함께 확인해요.</div>`
      : `<div class="guide">틀린 문항마다 세 칸을 채우고 <b>재채점</b>을 누르십시오. 맞으면 클리어, 틀리면 그 답을 고른 이유부터 다시 적습니다. 정답은 클리어하면 보여요.</div>`;
    return `<section class="step${RS.stage==='done'?' done':''}" id="fixBox"><h2>오답하기 · 클리어 ${nc} / ${wq.length}</h2>${head}
      ${wq.map(fixCard).join('')}</section>`;
  }
  function fixCard(q){
    const r=rvOf(q), d=RS.detail[q]||{}, dr=RS.draft[q]||{}, tries=r.tries||[];
    const flags=(r.help?'<span class="fl">선생님 도움 요청함</span>':'')+(r.error?'<span class="fl">문항 오류 신고함</span>':'');
    const hist=tries.length?`<div class="hist">${tries.map((t,i)=>`<div>${i+1}번째 · ${escapeHtml(t.pick)} ${t.ok?'<b class="ok">맞음</b>':'<b class="ng">틀림</b>'}</div>`).join('')}</div>`:'';
    if(r.cleared_at){
      return `<div class="rv clr" id="rv${q}"><div class="rvh">${q}번 · <b class="ok">클리어</b> · 정답 <b class="ok">${escapeHtml(RS.answers[q]!=null?RS.answers[q]:'')}</b>${flags}</div>${hist}</div>`;
    }
    const w=curWrong(q);
    const errBox = r.error ? `<div class="errdone">신고 내용: ${escapeHtml(r.error.text||'')}</div>`
      : `<div class="errbox" style="display:${dr.errOpen?'block':'none'};"><textarea class="fix" data-f="err" maxlength="300" placeholder="어디가 잘못된 것 같은지 적어 주세요. (예: 정답이 ③도 맞는 것 같아요)" oninput="setDraft(${q},'err',this.value)">${escapeHtml(dr.err||'')}</textarea>
          <button type="button" class="sbtn" onclick="sendFlag(${q},'error')">오류 신고 보내기</button></div>`;
    return `<div class="rv" id="rv${q}">${QS&&qHtml(q)?`<details class="pasd" style="margin:0 0 8px"><summary style="cursor:pointer;color:#3d675d;font-size:14px">${q}번 문제 다시 보기</summary><div style="margin-top:8px">${pidOf(q)?`<div class="gqp" style="margin:0 0 8px;max-height:40vh;overflow:auto">${pasHtml(q)}</div>`:''}${qHtml(q)}</div></details>`:''}<div class="rvh">${q}번 · 지금 틀린 답 <b>${escapeHtml(w||'무응답')}</b>${tries.length?` · ${tries.length}번 시도`:''}${flags}</div>${hist}
      <div class="lab">① 내가 틀린 답(${escapeHtml(w||'무응답')})을 고른 이유</div>
      <textarea class="fix" data-f="ww" maxlength="300" placeholder="그 답을 왜 골랐는지 그때 생각을 적어 보세요." oninput="setDraft(${q},'ww',this.value)">${escapeHtml(dr.ww||'')}</textarea>
      <div class="lab">② 다시 고른 답</div>${pickInput(q, d.type||'choice5', dr.pick)}
      <div class="lab">③ 이 답이 정답인 이유</div>
      <textarea class="fix" data-f="wr" maxlength="300" placeholder="이 답이 왜 맞는지 근거를 찾아 적어 보세요." oninput="setDraft(${q},'wr',this.value)">${escapeHtml(dr.wr||'')}</textarea>
      <button type="button" class="stepbtn" id="fixBtn${q}" onclick="sendFix(${q})">재채점</button>
      <div class="flags">
        <button type="button" class="sbtn" onclick="qaOpen(${q})">${qaCount(q)?'선생님과 나눈 질문 보기':'왜 틀렸는지 모르겠어요 · 선생님께 질문하기'}${qaNew(q)?` <span class="nw" style="background:#D9485F;color:#fff;border-radius:999px;padding:0 6px;font-size:11px">${qaNew(q)}</span>`:''}</button>
        ${r.error?'':`<button type="button" class="sbtn" onclick="toggleErr(${q})">문항 오류 신고</button>`}
      </div>${errBox}</div>`;
  }
  function pickInput(q,t,v){
    if(t==='ox') return `<div class="ox">${['O','X'].map(x=>`<button class="${v===x?'sel':''}" onclick="pickRe(${q},'${x}',this)">${x}</button>`).join('')}</div>`;
    if(t==='text') return `<input type="text" class="tans" placeholder="답 입력" value="${escapeHtml(v||'')}" oninput="setDraft(${q},'pick',this.value.trim())">`;
    let h='<div class="choices">';
    for(let j=1;j<=5;j++) h+=`<button type="button" aria-label="${j}번" class="${v===String(j)?'sel':''}" onclick="pickRe(${q},'${j}',this)">${'①②③④⑤'[j-1]}</button>`;
    return h+'</div>';

  const CLR_KEY='hw_clear_seen';
  function clearSeen(){ try{ return JSON.parse(localStorage.getItem(CLR_KEY)||'[]')||[]; }catch(e){ return []; } }
  function meUrl(){ let u=''; try{ u=sessionStorage.getItem('shueguk_me')||localStorage.getItem('shueguk_me')||''; }catch(e){}
    return /\/shueguk-report\/s\.html\?/.test(u)?u.replace(/#.*$/,''):''; }
  function nextHref(n, rest){
    const q=new URLSearchParams({ c:n.c, t:n.t||'', nm:FX.name||'', sc:FX.school||'', gr:FX.grade||'' });
    if(rest.length) q.set('nx', rest.map(x=>(x.t||'')+'\t'+x.c).join('\n'));
    return location.pathname+'?'+q.toString();
  }
  function clearShow(){
    if(!RS || document.querySelector('.hpop')) return;
    if(RS.id){ const seen=clearSeen(); if(seen.includes(RS.id)) return;
      try{ localStorage.setItem(CLR_KEY, JSON.stringify([RS.id].concat(seen).slice(0,60))); }catch(e){} }
    const wq=Object.keys(RS.detail||{}).filter(q=>RS.detail[q]&&RS.detail[q].ok===false).map(Number);
    const handed=wq.filter(q=>{ const r=rvOf(q); return !r.cleared_at&&(r.help||r.error); }).length;
    const first=!wq.length;
    const CH=first
      ? ['한 번에 모두 맞혔어요! 실력이 차곡차곡 쌓이고 있어요.','완벽해요! 이 기세 그대로 다음 세트도 가 볼까요?']
      : ['틀린 문항을 끝까지 다시 풀어 냈어요. 이게 진짜 실력이 돼요!','오답까지 해낸 지금이 가장 많이 자란 순간이에요.','끝까지 해낸 노력이 실력으로 쌓이고 있어요. 멋져요!'];
    const cheer=CH[Math.floor(Math.random()*CH.length)];
    const nx=(FX&&FX.next)||[], n=nx[0]||null, me=meUrl();
    const st=RS.st||{};
    const box=document.createElement('div'); box.className='hpop'; box.setAttribute('role','dialog');
    box.innerHTML=`<div class="hpc clr"><div class="hst"><img src="https://coke4497-sys.github.io/shueguk-report/assets/sk-cheer-hearts.png" alt=""></div>
      <div class="ht">H WORK 클리어! <span class="hh">♥</span></div>
      <div><div class="cs">${Number(RS.got)||0} / ${Number(RS.total)||0}</div>
        <div class="nq">${first?'첫 제출에 모두 정답':'오답 '+wq.length+'문항 '+(handed?'오답하기 마침':'모두 클리어')}</div></div>
      <div class="hs">${cheer}</div>
      ${handed?`<div class="hw">선생님께 넘긴 ${handed}문항은 수업 시간에 함께 확인해요.</div>`:''}
      ${n?`<div class="hw" style="font-weight:700;">교재 다음 챕터에 도전할까요?</div>
        <div class="nb"><small>다음 H WORK${n.t?' · '+escapeHtml(n.t):''}</small>${escapeHtml(n.c)}</div>
        <a class="go" id="clrNext" href="${escapeHtml(nextHref(n, nx.slice(1)))}">다음 챕터 도전하기</a>`
        : `<div class="hw">배정된 H WORK을 모두 냈어요. 정말 수고했어요!</div>`}
      ${me?`<a class="alt" id="clrList" href="${escapeHtml(me+'#hw')}">다른 H WORK 고르기</a>`:''}
      <button type="button" class="cl">결과 다시 보기</button></div>`;
    document.body.appendChild(box);
    heartBurst(box.querySelector('.hst')); setTimeout(()=>heartBurst(box.querySelector('.hst')), 650);
    box.querySelector('.cl').onclick=()=>box.remove();
  }
  function heartBurst(host){
    if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const C=['#f28bb0','#f7b6c9','#e86a93','#ffd0dc','#c9b6f2'];
    for(let i=0;i<18;i++){ const h=document.createElement('span'); h.className='hb'; h.textContent='♥';
      const a=Math.PI*2*i/18+Math.random()*.3, r=90+Math.random()*70;
      h.style.cssText=`color:${C[i%5]};--x:${Math.cos(a)*r}px;--y:${Math.sin(a)*r-30}px;font-size:${16+Math.random()*16}px;animation-delay:${Math.random()*.25}s`;
      host.appendChild(h); setTimeout(()=>h.remove(), 1900); }
  }
  function qaReask(q){ (RS.reask=RS.reask||{})[q]=true; keepScroll(q, drawReport); const t=document.getElementById('qaIn'+q); if(t) t.focus(); }
  async function qaClear(q){   // 리포트 073 hwork_qa_clear — 틀린 문항이면 클리어(정답이 열림), 맞힌 문항은 '이해했어요'만
    const b=document.getElementById('qaOk'+q); if(b){ b.disabled=true; b.textContent='기록하는 중…'; }
    try{
      const j=await sbRpc('hwork_qa_clear', { p:{ id:RS.id, key:RS.key, q:String(q) } });
      if(!j.ok){ toast(j.error||'기록하지 못했어요'); if(b){ b.disabled=false; b.textContent='이해했어요'; } return; }
      RS.review=RS.review||{}; RS.review[q]=j.review||Object.assign({}, RS.review[q]||{}, { understood_at:j.at });
      if(j.ans!=null){ RS.answers=RS.answers||{}; RS.answers[q]=j.ans; if(RS.detail[q]) RS.detail[q].ans=j.ans; }
      const was=RS.stage; RS.stage=calcStage(); if(was!=='done' && RS.stage==='done') setTimeout(clearShow, 450);
      toast(j.cleared?q+'번 클리어! 정답이 열렸어요':'좋아요. 이해했다고 기록했어요');
      keepScroll(q, drawReport);
    }catch(e){ toast('인터넷 연결을 확인하고 다시 눌러 주세요'); if(b){ b.disabled=false; b.textContent='이해했어요'; } }
  }
  async function qaSend(q){
    const inp=document.getElementById('qaIn'+q), text=inp?inp.value.trim():'';
    if(!text){ toast('질문을 적어 주세요'); if(inp) inp.focus(); return; }
    const btn=document.getElementById('qaGo'+q); btn.disabled=true; btn.textContent='보내는 중…';
    try{
      const j=await sbRpc('hwork_qa_post', { p:{ id:RS.id, key:RS.key, q:String(q), text } });
      if(!j.ok){ toast(j.error||'보내지 못했어요'); btn.disabled=false; btn.textContent='선생님께 보내기'; return; }
      RS.qa=j.msgs||RS.qa; if(RS.reask) delete RS.reask[q];
      (j.push||[]).forEach(id=>{   // 담당 선생님 슈톡 알림(리포트 072) — 못 보내면 클로슈 순찰이 보낸다
        fetch('https://bangdbhqpphqqdwcledg.supabase.co/functions/v1/hwork-ask',{ method:'POST', headers:{ 'Content-Type':'text/plain' }, body:JSON.stringify({ task_id:id }), keepalive:true }).catch(()=>{}); });
      const d=RS.detail[q]||{}, r=rvOf(q);
      if(d.ok===false && d.type!=='essay' && !r.cleared_at && !r.help){   // 오답하기를 '선생님께 넘김'으로
        try{ const f=await sbRpc('hwork_flag', { p:{ id:RS.id, key:RS.key, q:String(q), kind:'help', text:text.slice(0,300) } });
             if(f.ok){ setReview(q, { help:{ at:f.at, text } }); const was=RS.stage; RS.stage=calcStage(); rsRemember(); if(was!=='done' && RS.stage==='done') setTimeout(clearShow, 900); } }catch(e){}
      }
      toast('선생님께 보냈어요');
      keepScroll(q, drawReport);
    }catch(e){ toast('인터넷 연결을 확인하고 다시 눌러 주세요'); btn.disabled=false; btn.textContent='선생님께 보내기'; }
  }
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && QA_Q!=null) qaClose(); });

  /* 학생 페이지 H WORK 카드의 질문·남은 오답하기 줄 — 주소 sid(제출 번호) + k(접근코드) 또는 st(학생ID)로 연다.
   * 제출 열쇠(retry_key)는 주소에 싣지 않고 hwork_qa_mine 응답에서 찾는다. 다른 기기에서도 이어 하도록. */
  (async function(){
    const qp=new URLSearchParams(location.search), sid=qp.get('sid'), k=qp.get('k')||'', st=qp.get('st')||'';
    if(!(sid && /^\d{1,18}$/.test(sid) && (k||st))) return;
    try{
      const j=await sbRpc('hwork_qa_mine', { p:{ key:k, student:st } });
      const x=j.ok && (j.list||[]).find(r=>String(r.id)===sid);
      if(!x || !x.key){ toast('그 제출 기록을 찾지 못했어요'); return; }
      QA_OPEN_Q=qp.get('q')||null; resumeOne(Number(sid), String(x.key));
    }catch(e){ toast('불러오지 못했어요. 잠시 뒤 다시 열어 주세요'); }
  })();

  /* ── 개인 리테스트 (2026-11-17 원장님 "개인 리테스트도 질문함에 합쳐줘", 리포트 070 · 다른 세션의 hwork_retests) ──
   * 선생님이 질문함에서 낸 리테스트를 학생 페이지 H WORK 목록의 [리테스트 풀기]로 연다: hwork.html?rt=번호&k=접근코드.
   * 그 제출에서 틀린 문항만 다시 푼다. 문제 원문이 있는 과제면 문제를 함께 띄운다. 한 번만 제출, 틀린 문항 정답은 감춘다. 별은 없다. */
  const RTM=(function(){ const q=new URLSearchParams(location.search), id=(q.get('rt')||'').trim();
    return /^\d+$/.test(id) ? { id:Number(id), key:(q.get('k')||'').trim(), st:(q.get('st')||'').trim(), pick:{}, data:null } : null; })();
  function rtShell(inner){
    document.getElementById('main').style.display='none';
    document.getElementById('footer').style.display='none';
    const r=document.getElementById('report'); r.style.display='block';
    r.innerHTML=`<div class="rbrand"><div class="name">이수경국어</div><div class="sub">Shueguk · H WORK 리테스트</div></div>`+inner;
    window.scrollTo(0,0);
  }
  async function initRetest(){
    if(!RTM.key && !RTM.st){ rtShell('<section><div class="guide">학생 페이지의 H WORK 메뉴에서 [리테스트 풀기]를 눌러 열어 주세요.</div></section>'); return; }
    rtShell('<section><div class="guide">불러오는 중…</div></section>');
    let d;
    try{ d=await sbRpc('hwork_retest_open', { p:{ key:RTM.key, student:RTM.st, id:RTM.id } }); }
    catch(e){ rtShell('<section><div class="guide">불러오지 못했습니다. 인터넷 연결을 확인하고 다시 열어 주세요.</div></section>'); return; }
    if(!d || !d.ok){ rtShell('<section><div class="guide">'+escapeHtml((d&&d.error)||'리테스트를 찾을 수 없습니다.')+'</div></section>'); return; }
    RTM.data=d;
    if(d.submitted) return rtResult(d.got, d.total, d.detail||{}, d.submitted_at);
    if(Array.isArray(d.parts)){   // 여러 과제를 모은 오답 리테스트(071) — 과제마다 문제 원문을 받아 리테스트 번호로 다시 잇는다
      RTM.qs={};
      const codes=[...new Set(d.parts.map(p=>p.teacher+'\u0001'+p.code))];
      await Promise.all(codes.map(async k=>{ const [t,c]=k.split('\u0001');
        try{ const qj=await sbRpc('hwork_qs', { p:{ teacher:t, code:c } }); if(qj&&qj.ok) RTM.qs[k]=qj; }catch(e){} }));
    }else{
      try{ const qj=await sbRpc('hwork_qs', { p:{ teacher:d.teacher, code:d.code } }); if(qj&&qj.ok) QS=qj; }catch(e){}
    }
    rtDraw();
  }
  function rtInput(q,t){
    const v=RTM.pick[q];
    if(t==='ox') return `<div class="ox">${['O','X'].map(x=>`<button class="${v===x?'sel':''}" onclick="rtPick('${q}','${x}',this)">${x}</button>`).join('')}</div>`;
    if(t==='text') return `<input type="text" class="tans" placeholder="답 입력" value="${escapeHtml(v||'')}" oninput="rtText('${q}',this.value)">`;
    let h='<div class="choices">';
    for(let j=1;j<=5;j++) h+=`<button class="${v===String(j)?'sel':''}" onclick="rtPick('${q}','${j}',this)">${j}</button>`;
    return h+'</div>';
  }
  function rtPick(q,v,btn){ RTM.pick[q]=v; btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('sel')); btn.classList.add('sel'); }
  function rtText(q,v){ v=v.trim(); if(v) RTM.pick[q]=v; else delete RTM.pick[q]; }
  function rtQ(q){   // 리테스트 q번의 문제·지문 HTML(여러 과제면 그 과제의 문제 화면으로)
    const d=RTM.data;
    if(!Array.isArray(d.parts)){ const p=QS?pidOf(q):''; return { pid:p, pas:p?pasHtml(q):'', q:QS?qHtml(q):'', src:'' }; }
    const pt=d.parts[Number(q)-1]||{}, k=pt.teacher+'\u0001'+pt.code, Q=RTM.qs&&RTM.qs[k];
    const src=String(pt.code||'').replace(/^SHUEGUK REAL 내신 기출\s*/,'').replace(/^\[[^\]]+\]\s*/,'')+' · '+pt.q+'번';
    if(!Q||!Q.items||!Q.items[pt.q]) return { pid:'', pas:'', q:'', src };
    const it=Q.items[pt.q], cls=Q.style==='real'?'rq':'gq', pid=it.pid?k+'|'+it.pid:'';
    return { pid, pas:it.pid?`<div class="${cls}">${(Q.passages||{})[it.pid]||''}</div>`:'', q:`<div class="${cls}">${it.html}</div>`, src };
  }
  function rtDraw(){
    const d=RTM.data, qs=d.qs||[];
    const tl=t=>t==='ox'?'OX':(t==='text'?'단답형':'5지선다');
    let lastPid='';
    rtShell(`<div class="tbar">${escapeHtml(d.code||'')}</div>
      <section><h2>리테스트 · ${qs.length}문항</h2>
        <div class="guide">${escapeHtml(d.name||'')} 학생이 ${Array.isArray(d.parts)?'과제에서':'이 과제에서'} <b>틀린 문항</b>만 모았습니다. 다시 풀고 답을 넣으십시오. 한 번만 제출할 수 있어요.</div>
        ${qs.map(q=>{ const t=((d.items||{})[q]||{}).type||'choice5', x=rtQ(q);
          const pas=(x.pid&&x.pid!==lastPid&&x.pas)?`<details class="pasd" open><summary>지문 보기</summary><div class="gqp">${x.pas}</div></details>`:''; lastPid=x.pid||lastPid;
          const noq=!x.q&&x.src?`<div class="guide" style="margin:4px 0 0">교재 「${escapeHtml(x.src)}」 문항을 보고 풀어 주세요.</div>`:'';
          return `<div class="rtq"><div class="qt">${escapeHtml(q)}번 · ${tl(t)}${x.src?' · '+escapeHtml(x.src):''}</div>${pas}${x.q}${noq}${rtInput(q,t)}</div>`; }).join('')}
        <button type="button" class="rtgo" id="rtGo" onclick="rtSubmit()">리테스트 제출하기</button>
      </section>`);
  }
  async function rtSubmit(){
    const qs=RTM.data.qs||[], miss=qs.filter(q=>RTM.pick[q]==null);
    if(miss.length && !confirm('아직 답을 넣지 않은 문항이 '+miss.length+'개 있습니다 ('+miss.join(', ')+'번).\n그대로 제출할까요?')) return;
    const btn=document.getElementById('rtGo'); btn.disabled=true; btn.textContent='채점 중…';
    try{
      const j=await sbRpc('hwork_retest_submit', { p:{ key:RTM.key, student:RTM.st, id:RTM.id, answers:RTM.pick } });
      if(j && (j.ok || j.reason==='done')) return rtResult(j.got, j.total, j.detail||{}, j.submitted_at||'');
      btn.disabled=false; btn.textContent='리테스트 제출하기'; toast((j&&j.error)||'제출하지 못했어요');
    }catch(e){ btn.disabled=false; btn.textContent='리테스트 제출하기'; toast('인터넷 연결을 확인하고 다시 눌러 주세요'); }
  }
  function rtResult(got, total, detail, at){
    const d=RTM.data||{}, qs=(d.qs||Object.keys(detail)).filter(q=>detail[q]);
    const wrong=qs.filter(q=>detail[q].ok===false);
    const rows=qs.map(q=>{ const x=detail[q], mine=(x.mine&&String(x.mine).length)?escapeHtml(x.mine):'<span class="blank">무응답</span>';
      return `<tr class="${x.ok?'':'wrong'}"><td class="qn">${escapeHtml(q)}</td><td class="mine">${mine}</td>
        <td>${x.ok?escapeHtml(x.ans||''):'<span class="hide">수업 시간에 확인해요</span>'}</td><td class="${x.ok?'o':'x'}">${x.ok?'O':'X'}</td></tr>`; }).join('');
    rtShell(`<div class="tbar">${escapeHtml(d.code||'')}</div>
      <section><h2>리테스트 결과</h2>
        <div class="scoreline"><span class="big">${got} / ${total}</span></div>
        <div class="snote">${wrong.length?'또 틀린 '+wrong.length+'문항('+wrong.join(', ')+'번)은 선생님이 결과를 보고 수업 시간에 함께 확인합니다.':'틀렸던 문항을 모두 맞혔습니다. 잘했어요!'}${at?' · 제출 '+escapeHtml(at):''}</div></section>
      <section><h2>문항별 채점</h2>
        <table class="detail"><tr><th>문항</th><th>내 답</th><th>정답</th><th>정오</th></tr>${rows}</table></section>`);
  }

  if(RTM) initRetest();
  else { drawResume(); init(); }
</script>
<script src="https://coke4497-sys.github.io/shueguk-report/me-back.js"></script>
<script src="oh.js"></script>
