<script>
/* ══ 교사 페이지 조용한 인증 (2026-08-25, 3단계) ═══════════════════════
 * 이 아래 연결부들이 수파베이스에 보내는 요청에 '교사 신분'을 붙인다.
 * 화면에 로그인 창은 없다 — 페이지가 열릴 때 알아서 받아 온다.
 *
 * 왜 필요한가:
 *   공개 키(sb_publishable_…)는 학생이 여는 페이지에도 들어 있어서, 그 키로 표를
 *   직접 읽을 수 있으면 전교생 명단(학생ID=비밀번호·접근코드)이 새어 나간다.
 *   그래서 공개 키에서는 표 접근을 없애고(anon), 표는 이 신분(authenticated)만
 *   읽고 쓰도록 나눴다. 학생 화면은 표 대신 함수(student_bundle 등)를 쓴다.
 *
 * 주의:
 *   · 이 조각은 **교사용 페이지에만** 넣는다. 학생이 여는 페이지(s·r·클리닉 신청·
 *     모의고사 신청·H WORK 제출)에는 절대 넣지 말 것 — 넣는 순간 위 보호가 무의미해진다.
 *   · 아래 연결부들이 시작할 때 window.fetch 를 붙잡아 두므로, 이 조각은 **그것들보다
 *     먼저** 실행돼야 한다. 페이지의 첫 스크립트 자리를 지킬 것.
 *   · 인증이 실패하면 예전처럼 공개 키로 보낸다(권한을 회수하기 전까지는 그래도 동작). */
(function(){
  var SB_URL = 'https://bangdbhqpphqqdwcledg.supabase.co';
  var SB_KEY = 'sb_publishable_dE9d1KIbpgYaQkaS2MSrlg_-7SiRJuT';
  var T_ID = 'teachers@shueguk.internal';
  var T_PW = 'shg_FCePWvnawH44SV8kYB9BHRKi6aag';
  var tok = null, until = 0, pending = null;
  var raw = window.fetch.bind(window);
  window.__sbRawFetch = raw;   // 허브 로그인 이름(teacher-name.js)은 공용 계정 신분을 거치지 않고 묻는다 — 없으면 이름을 못 찾아 입력 창이 떴다(2026-11-17)
  var TOK_LS = 'sb_teacher_tok_v1';   // 받아 둔 신분증은 브라우저에 남겨 다음 페이지에서 다시 받지 않는다(1시간짜리)

  function cachedTok(){
    try {
      var c = JSON.parse(localStorage.getItem(TOK_LS) || 'null');
      if (c && c.t && c.u > Date.now()){ tok = c.t; until = c.u; return true; }
    } catch(e){}
    return false;
  }
  function auth(){
    if (tok && Date.now() < until) return Promise.resolve(tok);
    if (cachedTok()) return Promise.resolve(tok);
    if (pending) return pending;
    var req = raw(SB_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: T_ID, password: T_PW })
    }).then(function(r){ return r.json(); }).then(function(d){
      if (!d || !d.access_token) throw new Error('teacher auth');
      tok = d.access_token;
      until = Date.now() + Math.max(60, (d.expires_in || 3600) - 300) * 1000;   // 만료 5분 전에 다시 받는다
      try { localStorage.setItem(TOK_LS, JSON.stringify({ t: tok, u: until })); } catch(e){}
      return tok;
    });
    /* 로그인이 멈춰 있으면 이 아래 모든 조회가 함께 멈춘다 — 10초를 넘기면 실패로 보고
     * 그 조회는 예전 방식(공개 키)으로 내보낸다. 다음 호출 때 다시 받는다. */
    var late = new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('teacher auth timeout')); }, 10000); });
    pending = Promise.race([req, late]).then(function(t){ pending = null; return t; },
                                            function(e){ pending = null; throw e; });
    return pending;
  }
  function withAuth(url, opts, t){
    var src = (opts && opts.headers) || {}, h = {};
    if (src.forEach && !src.hasOwnProperty) src.forEach(function(v, k){ h[k] = v; });
    else for (var k in src) h[k] = src[k];
    h['apikey'] = SB_KEY;
    h['Authorization'] = 'Bearer ' + t;
    var o = {}; for (var k2 in (opts || {})) o[k2] = opts[k2];
    o.headers = h;
    return o;
  }
  window.fetch = function(url, opts){
    var u = (typeof url === 'string') ? url : ((url && url.url) || '');
    if (u.indexOf(SB_URL + '/rest/v1') !== 0 && u.indexOf(SB_URL + '/storage/v1') !== 0) return raw(url, opts);   // 저장소(답장 첨부)도 교사 신분
    return auth().then(function(t){
      return raw(url, withAuth(url, opts, t)).then(function(r){
        if (r.status !== 401) return r;
        tok = null; until = 0;                       // 만료가 겹쳤으면 한 번만 다시 받아 재시도
        try { localStorage.removeItem(TOK_LS); } catch(e){}
        return auth().then(function(t2){ return raw(url, withAuth(url, opts, t2)); });
      });
    }, function(){ return raw(url, opts); });
  };
})();
</script>
<script>
/* ══ H WORK 채점 결과 — 선생님 화면 (2026-11-17 원장님 디자인 · "학생에게도 동일한 화면이 보이고 여기서 교사와 학생이 질문 답변이")
 * 학생 화면(hwork.html 결과)과 같은 result_view.js 로 그린다. 주소 ?sid=제출번호(&q=문항) — 슈톡 업무 카드의 'H WORK 질문' 링크·제출 확인에서 연다.
 * 문항 카드 안에서 학생 질문에 바로 답장(사진·영상·파일 첨부, Ctrl+V 캡처) — 답장하면 슈톡 업무 카드의 그 할 일이 완료된다(리포트 072 트리거).
 * 위에 개인 리테스트(이 제출의 틀린 문항, hwork_retests). 주소 없이 열면 답장을 기다리는 질문 목록. */
const SB_REST="https://bangdbhqpphqqdwcledg.supabase.co/rest/v1", SB_STORE="https://bangdbhqpphqqdwcledg.supabase.co/storage/v1", SB_KEY="sb_publishable_dE9d1KIbpgYaQkaS2MSrlg_-7SiRJuT";
const BUCKET='hwork-reply-files', FILE_ONLY='(첨부 파일)';
const $=id=>document.getElementById(id), enc=encodeURIComponent;
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2400); }
async function sb(path, opts){
  const o=Object.assign({}, opts||{}); o.headers=Object.assign({ apikey:SB_KEY, Authorization:'Bearer '+SB_KEY, 'Content-Type':'application/json' }, (opts||{}).headers||{});
  const r=await fetch(SB_REST+path, o);
  if(!r.ok) throw new Error(path.split('?')[0]+' '+r.status);
  const t=await r.text(); return t?JSON.parse(t):null;
}
let ME='', ANS={}, BANK={}, PREV={}, REUSE={}, SUB=null, QA=[], QS={}, QP={}, STYLE='', CTX=null, PEND={}, FBLOB={}, RT=null;
const qp=new URLSearchParams(location.search), SID=qp.get('sid'), OPENQ=qp.get('q');
async function myName(){   // 답장 이름 = 허브에 로그인한 선생님(teacher-name.js). 묻는 창은 없앴다(2026-11-17 원장님 "로그인한 강사명으로 기록")
  if(ME) return ME;
  try{ if(window.shuegukTeacherName) ME=(await shuegukTeacherName())||''; }catch(e){}
  return ME;
}
/* 문제 원문 — 문항 은행(data.bank → gbank_items) 또는 교재(hwork_src_items, 숨긴 것도 선생님께는 보임) */
/* 교재 해설(075 — 지필 워크북 해설·오답 해설) — 선생님 화면은 늘 펼쳐 볼 수 있다 */
const EXPL={};
function wrongLines(t){ return String(t||'').split(/(?=[①②③④⑤])/).map(x=>x.trim()).filter(Boolean); }
function explHtml(q){ const x=EXPL[q]; if(!x) return '';
  return `<details class="expl"><summary>교재 해설 보기</summary>${x.expl?`<div>${esc(x.expl)}</div>`:''}${wrongLines(x.wrong).map(w=>`<div>${esc(w)}</div>`).join('')}</details>`; }
async function loadQs(s){
  try{
    const r=await sb('/hwork_homeworks?select=data&teacher=eq.'+enc(s.teacher)+'&code=eq.'+enc(s.code)+'&limit=1');
    const d=(r[0]&&r[0].data)||{};
    Object.keys(d.items||{}).forEach(n=>{ const a=d.items[n]&&d.items[n].ans; if(a!=null&&a!=='') ANS[n]=Array.isArray(a)?a.join(', '):String(a); });
    if(d.bank && typeof d.bank==='object'){
      STYLE='gq'; BANK=d.bank; const ids=[...new Set(Object.values(d.bank))];
      const g=ids.length?await sb('/gbank_items?select=id,html,pid,ans&id=in.('+ids.join(',')+')'):[];
      const by={}; g.forEach(x=>by[x.id]=x);
      Object.keys(d.bank).forEach(n=>{ const x=by[d.bank[n]]; if(x&&ANS[n]==null) ANS[n]=String(x.ans); if(x) QS[n]={ html:x.html.replace(new RegExp('<span class="cn" data-d="'+x.ans+'">'),'<span class="cn ok" data-d="'+x.ans+'">'), pid:x.pid }; });
      const pids=[...new Set(g.map(x=>x.pid).filter(Boolean))];
      if(pids.length){ (await sb('/gbank_passages?select=pid,html&pid=in.('+pids.map(p=>'"'+p+'"').join(',')+')')).forEach(p=>QP[p.pid]=p.html); }
    }else{
      STYLE='rq';
      let rows;
      try{ rows=await sb('/hwork_src_items?select=no,html,pid,ans,type,expl,wrong&code=eq.'+enc(s.code)); }
      catch(e){ rows=await sb('/hwork_src_items?select=no,html,pid,ans,type&code=eq.'+enc(s.code)); }   // 075 전
      rows.forEach(x=>{ if(x.expl||x.wrong) EXPL[x.no]={ expl:x.expl||'', wrong:x.wrong||'' }; const okc=String(x.ans||'').split('(')[0]; if(ANS[x.no]==null&&x.ans) ANS[x.no]=String(x.ans);
        QS[x.no]={ html:x.type==='5지'&&/[①②③④⑤]/.test(okc)?x.html.replace(/<span class="cn">([①②③④⑤])<\/span>/g,(m,c)=>okc.includes(c)?'<span class="cn ok">'+c+'</span>':m):x.html, pid:x.pid }; });
      const pids=[...new Set(rows.map(x=>x.pid).filter(Boolean))];
      if(pids.length){ (await sb('/hwork_src_passages?select=pid,html&pid=in.('+pids.map(p=>'"'+p+'"').join(',')+')')).forEach(p=>QP[p.pid]=p.html); }
    }
  }catch(e){}
}
/* 같은 문제에 다른 학생에게 남긴 답장 — 문항 은행 문제는 문항 id 가 같으면(과제가 달라도), 그 밖은 같은 과제·같은 번호 (2026-11-17 원장님 "동일한 문제를 질문 받았을 때 답변 불러오기") */
async function loadPrev(){
  try{
    const pairs={};   // 'code|q' -> 이 제출의 문항 번호
    if(Object.keys(BANK).length){
      const idToQ={}; Object.keys(BANK).forEach(n=>{ (idToQ[BANK[n]]=idToQ[BANK[n]]||[]).push(n); });
      const hws=await sb('/hwork_homeworks?select=code,data&limit=2000');
      (hws||[]).forEach(h=>{ const b=h.data&&h.data.bank; if(!b||typeof b!=='object') return;
        Object.keys(b).forEach(n=>{ (idToQ[b[n]]||[]).forEach(myq=>{ pairs[h.code+'|'+n]=myq; }); }); });
    }else Object.keys(SUB.detail||{}).forEach(n=>{ pairs[SUB.code+'|'+n]=n; });
    const codes=[...new Set(Object.keys(pairs).map(k=>k.slice(0,k.lastIndexOf('|'))))];
    if(!codes.length) return;
    const inList=codes.map(c=>'"'+c.replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"').join(',');
    let rows=[];
    try{ rows=await sb('/hwork_qa?select=id,q,body,name,at,sub_id,who,files:hwork_reply_files(name,size,mime,path),s:hwork_submissions!inner(code,name)&who=eq.'+enc('선생님')+'&s.code=in.('+enc(inList)+')&order=id.desc&limit=400'); }
    catch(e){ rows=await sb('/hwork_qa?select=id,q,body,name,at,sub_id,who,s:hwork_submissions!inner(code,name)&who=eq.'+enc('선생님')+'&s.code=in.('+enc(inList)+')&order=id.desc&limit=400'); }
    PREV={}; const seen={};
    (rows||[]).forEach(r=>{ if(r.who!=='선생님' || r.sub_id==SUB.id || !r.s) return;
      const myq=pairs[r.s.code+'|'+r.q]; if(myq==null) return;
      const k=myq+'|'+r.body; if(seen[k]) return; seen[k]=1;
      (PREV[myq]=PREV[myq]||[]).push(r); });
  }catch(e){ PREV={}; }
}
function prevHtml(q){

  if(!body && !files.length && !again.length){ toast('답장을 적거나 파일을 붙여 주세요'); return; }
  if(!body) body=FILE_ONLY;
  const name=await myName(); if(!name){ toast('허브 로그인 이름을 찾지 못했어요. 티쳐스에 다시 로그인한 뒤 보내 주세요'); return; }
  const btn=document.querySelector('[data-send="'+q+'"]'); btn.disabled=true; btn.textContent='보내는 중…';
  try{
    const up=[]; for(const f of files){ btn.textContent='파일 올리는 중… ('+(up.length+1)+'/'+files.length+')'; up.push(await upFile(SUB.id, f)); }
    const r=await sb('/hwork_qa',{ method:'POST', headers:{ Prefer:'return=representation' }, body:JSON.stringify({ sub_id:SUB.id, q:String(q), who:'선생님', name, body }) });
    again.forEach(f=>up.push({ path:f.path, name:f.name, size:f.size, mime:f.mime||'' }));   // 지난 답장 첨부 — 같은 파일을 다시 잇는다(올리지 않음)
    if(up.length) await sb('/hwork_reply_files',{ method:'POST', headers:{ Prefer:'return=minimal' }, body:JSON.stringify(up.map(x=>Object.assign({ sub_id:SUB.id, q:String(q), qa_id:r[0].id, created_by:name }, x))) });
    (PEND[q]||[]).forEach(x=>x._u&&URL.revokeObjectURL(x._u)); PEND[q]=[]; REUSE[q]=[]; if(ta) ta.value='';
    loadPrev();
    toast('답장을 보냈어요');
    if(window.shuegukActivity) shuegukActivity('H WORK', '질문 답장', SUB.name+' '+q+'번', SUB.code, false);
    await loadQa(); draw();
  }catch(e){ toast('보내지 못했어요. 다시 눌러 주세요'); btn.disabled=false; btn.textContent='답장 보내기'; }
}
document.addEventListener('click', e=>{ const b=e.target.closest&&e.target.closest('[data-send]'); if(b) reply(b.dataset.send); });
/* 답장 수정·지우기 (2026-11-20 원장님 — 잘못 붙여 넣은 답장을 고치거나 지움, 리포트 089).
   고치면 학생 화면에 다시 '새' 표시가 붙고(read_at 비움), 지우면 그 문항이 다시 '답장 필요'가 되며 슈톡 할 일도 '대기'로 돌아간다(트리거). */
const EDIT={};   // 고치는 중인 답장 id → 쓰던 글
function msgEditHtml(m){
  if(m.who!=='선생님' || !(m.id in EDIT)) return null;
  return `<textarea class="edt" data-edt="${m.id}" maxlength="5000">${esc(EDIT[m.id])}</textarea>`;
}
function msgToolsHtml(m){
  if(m.who!=='선생님') return '';
  const ed=m.edited?`<span class="ed">수정됨 ${esc(String(m.edited).slice(5,16))}</span>`:'';
  if(m.id in EDIT) return `<div class="mt"><button type="button" data-edsave="${m.id}">저장</button><button type="button" data-edcancel="${m.id}">취소</button></div>`;
  return `<div class="mt">${ed}<button type="button" data-edit="${m.id}">수정</button><button type="button" class="del" data-qdel="${m.id}">지우기</button></div>`;
}
document.addEventListener('input', e=>{ const t=e.target; if(t&&t.dataset&&t.dataset.edt) EDIT[t.dataset.edt]=t.value; });
document.addEventListener('click', async e=>{
  const g=k=>e.target.closest&&e.target.closest('['+k+']'); let b;
  if((b=g('data-edit'))){ const m=QA.find(x=>String(x.id)===b.dataset.edit); if(!m) return;
    EDIT[m.id]=m.body===FILE_ONLY?'':m.body; draw();
    const t=document.querySelector('textarea[data-edt="'+m.id+'"]'); if(t){ t.focus(); t.setSelectionRange(t.value.length,t.value.length); } return; }
  if((b=g('data-edcancel'))){ delete EDIT[b.dataset.edcancel]; draw(); return; }
  if((b=g('data-edsave'))){ const id=b.dataset.edsave, m=QA.find(x=>String(x.id)===id); if(!m) return;
    let body=String(EDIT[id]||'').trim();
    if(!body){ if((m.files||[]).length) body=FILE_ONLY; else { toast('글을 비우려면 [지우기]를 눌러 주세요'); return; } }
    if(body===m.body){ delete EDIT[id]; draw(); return; }
    b.disabled=true; b.textContent='저장 중…';
    try{
      await sb('/hwork_qa?id=eq.'+id+'&who=eq.'+enc('선생님'),{ method:'PATCH', headers:{ Prefer:'return=minimal' }, body:JSON.stringify({ body, edited_at:new Date().toISOString(), read_at:null }) });
      delete EDIT[id]; toast('답장을 고쳤어요');
      if(window.shuegukActivity) shuegukActivity('H WORK', '답장 수정', SUB.name+' '+m.q+'번', SUB.code, false);
      await loadQa(); draw();
    }catch(err){ toast('고치지 못했어요. 다시 눌러 주세요'); b.disabled=false; b.textContent='저장'; }
    return; }
  if((b=g('data-qdel'))){ const id=b.dataset.qdel, m=QA.find(x=>String(x.id)===id); if(!m) return;
    if(!confirm(m.q+'번 문항에 보낸 이 답장을 지울까요?\n학생 화면에서도 사라지고, 되돌릴 수 없습니다.')) return;
    b.disabled=true;
    try{
      await sb('/hwork_qa?id=eq.'+id+'&who=eq.'+enc('선생님'),{ method:'DELETE', headers:{ Prefer:'return=minimal' } });
      delete EDIT[id]; toast('답장을 지웠어요');
      if(window.shuegukActivity) shuegukActivity('H WORK', '답장 지움', SUB.name+' '+m.q+'번', SUB.code, false);
      await loadQa(); loadPrev(); draw();
    }catch(err){ toast('지우지 못했어요. 다시 눌러 주세요'); b.disabled=false; }
  }
});
async function markRead(q){
  const mine=QA.filter(m=>String(m.q)===String(q)&&m.who==='학생'&&!m.read), ids=mine.map(m=>m.id); if(!ids.length) return;
  mine.forEach(m=>{ m.read=true; });
  try{ await sb('/hwork_qa?id=in.('+ids.join(',')+')',{ method:'PATCH', headers:{ Prefer:'return=minimal' }, body:JSON.stringify({ read_at:new Date().toISOString() }) }); }catch(e){}
}
/* 개인 리테스트 — 이 제출의 틀린 문항(서술형 빼고) */
const LEFT_RE=/퇴원|아웃|휴원/; let STU=null;
function gdOf(g){ const s=String(g||'').replace(/\s+/g,''); const m=s.match(/([1-3])학년/)||s.match(/고([1-3])/); if(m) return m[1]; const a=s.match(/[1-3]/g); return a?a[a.length-1]:''; }
function stuIsSub(st, sub){
  const nm=String(st.name||'').trim(), base=nm.replace(/[A-Za-z]$/,''), rn=String(sub.name||'').trim();
  if(!nm || (rn!==nm && rn!==base)) return false;
  const mg=gdOf(st.grade), rg=gdOf(sub.grade); if(mg && rg && mg!==rg) return false;
  const ms=String(st.school||'').replace(/\s+/g,''), rs=String(sub.school||'').replace(/\s+/g,'');
  if(ms && rs && ms.indexOf(rs)<0 && rs.indexOf(ms)<0) return false;
  return true;
}
function wrongQs(){ const d=SUB.detail||{}; return Object.keys(d).filter(q=>d[q]&&d[q].ok===false&&d[q].type!=='essay').sort((a,b)=>a-b); }
function rtHtml(){
  if(RT===false) return '';
  const wq=wrongQs();
  let h='<section class="rtc"><h2>개인 리테스트</h2>';
  if(RT){ const qs=RT.qs||[];
    if(RT.submitted_at){ const still=Object.keys(RT.detail||{}).filter(q=>RT.detail[q]&&RT.detail[q].ok===false).sort((a,b)=>a-b);
      h+=`<div class="m"><span class="st ok">리테스트 ${RT.got} / ${RT.total}</span> ${esc(RT.submitted_at)} 제출 · ${still.length?'또 틀림 '+still.join(', ')+'번':'모두 맞힘'}</div>`; }
    else h+=`<div class="m"><span class="st wait">아직 안 풂</span> ${qs.length}문항 · ${qs.join(', ')}번</div><button type="button" class="del" id="rtDel">리테스트 지우기</button>`;
  }else if(!wq.length) h+='<div class="m">틀린 문항이 없어 리테스트를 낼 수 없습니다.</div>';
  else h+=`<div class="m">틀린 ${wq.length}문항(${wq.join(', ')}번)만 모아 이 학생에게만 다시 풀게 합니다. 학생 페이지 H WORK 목록에 바로 보여요. 별은 주지 않습니다.</div><button type="button" id="rtMake">리테스트 내기</button>`;
  return h+'</section>';
}
async function loadRt(){ try{ RT=(await sb('/hwork_retests?select=id,qs,submitted_at,got,total,detail&src_id=eq.'+SUB.id))[0]||null; }catch(e){ RT=false; } }
document.addEventListener('click', async e=>{
  if(e.target.id==='rtMake'){
    const wq=wrongQs(); e.target.disabled=true;
    try{
      if(!STU){ const out=[]; for(let off=0;;off+=1000){ const r=await sb('/students?select=code,name,school,grade,enrolled,phone_student&order=id.asc&limit=1000&offset='+off); out.push(...r); if(r.length<1000) break; } STU=out.filter(x=>!LEFT_RE.test(String(x.enrolled||''))); }
      const hit=STU.filter(x=>stuIsSub(x, SUB)); const st=hit.length===1?hit[0]:(hit.length?'dup':null);
      if(st==='dup'){ toast('같은 이름의 학생이 여럿이라 누구에게 낼지 정하지 못했습니다'); e.target.disabled=false; return; }
      if(!st||!st.code){ toast('재원 명단에서 이 학생(접근코드)을 찾지 못했습니다'); e.target.disabled=false; return; }
      if(!confirm(SUB.name+' 학생에게 틀린 '+wq.length+'문항('+wq.join(', ')+'번)으로 리테스트를 낼까요?')){ e.target.disabled=false; return; }
      await sb('/hwork_retests?on_conflict=src_id',{ method:'POST', headers:{ Prefer:'resolution=ignore-duplicates,return=minimal' },
        body:JSON.stringify([{ teacher:SUB.teacher, code:SUB.code, src_id:SUB.id, stu_code:st.code, name:SUB.name, school:SUB.school||'', grade:SUB.grade||'', qs:wq.map(String), created_by:(await myName())||'' }]) });
      toast('리테스트를 냈어요'); await loadRt(); draw();
    }catch(err){ toast('리테스트를 내지 못했어요'); e.target.disabled=false; }
  }
  if(e.target.id==='rtDel'){
    if(!confirm('이 리테스트를 지울까요? 학생 화면에서도 사라집니다.')) return;
    try{ await sb('/hwork_retests?id=eq.'+RT.id+'&submitted_at=is.null',{ method:'DELETE', headers:{ Prefer:'return=minimal' } }); toast('지웠어요'); }catch(err){ toast('지우지 못했어요'); }
    await loadRt(); draw();
  }
});
function draw(){
  const keep={};   // 다시 그릴 때 쓰던 답장 글은 그대로
  document.querySelectorAll('textarea[data-rin]').forEach(t=>{ keep[t.dataset.rin]=t.value; });
  const n=Math.max(Number(SUB.total)||0, ...Object.keys(SUB.detail||{}).map(Number));
  if(!CTX){
    CTX={ mode:'teacher', st:{ name:SUB.name, school:SUB.school, grade:SUB.grade, teacher:SUB.teacher, code:SUB.code, ts:SUB.ts },
      got:Number(SUB.got)||0, total:Number(SUB.total)||0, n, detail:SUB.detail||{}, review:SUB.review||{}, answers:ANS,
      away:Number(SUB.away_n)>0?{ n:Number(SUB.away_n), sec:Number(SUB.away_sec)||0 }:null, time:SUB.timelog||null, reviewAt:SUB.review_at||'', qa:QA,
      hooks:{
        qhtml:q=>{ const x=QS[q]; if(!x) return null; return { pas:x.pid&&QP[x.pid]?`<div class="${STYLE}">${QP[x.pid]}</div>`:'', html:`<div class="${STYLE}">${x.html}</div>` }; },
        composer:q=>(('checked' in SUB)?`<div class="qchk">${(SUB.checked||{})[q]?`<span class="on">♥ ${esc(SUB.checked[q].by)} 선생님 확인 · ${esc(String(SUB.checked[q].at).slice(5,16))}</span><button type="button" class="un" onclick="checkQ('${q}',false)">확인 취소</button>`:`<button type="button" onclick="checkQ('${q}',true)">잘 고쳤습니다 ♥</button>`}</div>`:'')+`<div class="cmp"><span class="lab">학생에게 답장</span>${prevHtml(q)}<textarea data-rin="${q}" maxlength="5000" placeholder="답장을 적어 주세요. 학생 화면 이 문항에 바로 보입니다. 사진은 Ctrl+V 로 붙여 넣어도 돼요.">${esc(keep[q]||'')}</textarea>${reuseHtml(q)}${attHtml(q)}<button type="button" class="go" data-send="${q}">답장 보내기</button></div>`,
        expl:q=>explHtml(q),
        files:f=>fsHtml(f),
        msgEdit:m=>msgEditHtml(m),
        msgTools:m=>msgToolsHtml(m),
        opened:q=>markRead(q),
        after:()=>fThumbs()
      } };
    CTX.ui={ filter:'전체', open:RV.openDefault(CTX) };
    if(OPENQ) CTX.ui.open.add(String(OPENQ));
  }
  CTX.qa=QA; CTX.extra=checkHtml()+rtHtml(); CTX.checked=SUB.checked||{}; CTX.checkDone=SUB.check_done||null;
  RV.draw($('view'), CTX);
  Object.keys(keep).forEach(q=>{ const t=document.querySelector('textarea[data-rin="'+q+'"]'); if(t) t.value=keep[q]; });
}
async function boot(){
  myName().then(n=>{ if(n) document.getElementById('backList').href='https://coke4497-sys.github.io/shueguk-h-work/hwork_teacher.html?t='+enc(n); });
  if(!SID || !/^\d{1,18}$/.test(SID)) return waitList();
  try{ SUB=(await sb('/hwork_submissions?select=*&id=eq.'+SID))[0]; }catch(e){}
  if(!SUB){ $('view').innerHTML='<div class="wl"><p>제출 기록을 찾지 못했습니다.</p></div>'; return; }
  await Promise.all([loadQs(SUB), loadQa(), loadRt()]);
  await loadPrev();
  alimReady();
  draw();
  if(OPENQ){ const t=document.getElementById('rvq'+OPENQ); if(t) t.scrollIntoView({ block:'start' }); }
  CTX.ui.open.forEach(q=>markRead(q));   // 열어 둔 카드의 학생 글은 읽음 — '새' 표시는 이번 화면에서는 남겨 두고 다음부터 사라짐
  setInterval(async()=>{ if(document.hidden || document.querySelector('textarea[data-rin]:focus') || Object.values(PEND).some(l=>l.length)) return;
    const before=QA.length; await loadQa(); if(QA.length!==before) draw(); }, 30000);
}
/* 주소 없이 열면 — 답장을 기다리는 질문(마지막 글이 학생) 목록 */
async function waitList(){
  let rows=[];
  try{ rows=await sb('/hwork_qa?select=sub_id,q,who,body,at,s:hwork_submissions(name,school,grade,code,teacher)&order=id.desc&limit=2000'); }catch(e){}
  const seen=new Set(), wait=[];
  rows.forEach(r=>{ const k=r.sub_id+'|'+r.q; if(seen.has(k)) return; seen.add(k); if(r.who==='학생'&&r.s) wait.push(r); });
  $('view').innerHTML=`<div class="wl"><h1>답장을 기다리는 H WORK 질문</h1><p>학생 질문은 슈톡 업무 카드로 알려 드려요. 줄을 누르면 그 학생의 채점 결과 화면에서 바로 답할 수 있어요.</p>
    ${wait.length?wait.map(r=>`<a class="row" href="?sid=${r.sub_id}&q=${enc(r.q)}"><b>${esc(r.s.name)}</b> · ${esc(r.q)}번<small>${esc(r.s.code)} · ${esc(r.s.teacher)} · ${esc(kst(r.at))}</small>${esc(r.body)}</a>`).join(''):'<p>답장을 기다리는 질문이 없습니다.</p>'}</div>`;
}
boot();
</script>
