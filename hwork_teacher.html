<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbyrc0j6EmVLrlfZeSchetAcEzWPEFAEV1RHStr6ZTJPDJeH6pcvRDemfWU64puojmSDPg/exec";

  /* ── 제출 목록·상세의 원본은 수파베이스 (2026-08-26, 020 원본 전환의 교사 화면) ──
   * 옛 백엔드(시트)는 사본이라, 사본 전송이 빠진 제출이 교사에게 안 보일 수 있었다.
   * 교사 조용한 인증(다른 티쳐스 페이지와 같은 계정·같은 localStorage 캐시)으로
   * hwork_submissions를 직접 읽는다. 실패하면 옛 백엔드로 폴백. */
  const SB_URL = 'https://bangdbhqpphqqdwcledg.supabase.co';
  const SB_KEY = 'sb_publishable_dE9d1KIbpgYaQkaS2MSrlg_-7SiRJuT';
  const T_LS = 'sb_teacher_tok_v1';
  let sbTok = null, sbUntil = 0;
  async function sbAuth(){
    if (sbTok && Date.now() < sbUntil) return sbTok;
    try {
      const c = JSON.parse(localStorage.getItem(T_LS) || 'null');
      if (c && c.t && c.u > Date.now()){ sbTok = c.t; sbUntil = c.u; return sbTok; }
    } catch(e){}
    const r = await fetch(SB_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: 'teachers@shueguk.internal', password: 'shg_FCePWvnawH44SV8kYB9BHRKi6aag' })
    });
    const d = await r.json();
    if (!d || !d.access_token) throw new Error('teacher auth');
    sbTok = d.access_token;
    sbUntil = Date.now() + Math.max(60, (d.expires_in || 3600) - 300) * 1000;
    try { localStorage.setItem(T_LS, JSON.stringify({ t: sbTok, u: sbUntil })); } catch(e){}
    return sbTok;
  }
  async function sbGet(path){
    const t = await sbAuth();
    const r = await fetch(SB_URL + '/rest/v1' + path,
      { headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + t }, cache: 'no-store' });
    if (!r.ok) throw new Error('sb ' + r.status);
    return r.json();
  }
  async function sbAllRows(path){        // 1,000행 한도 자동 페이징
    let out = [], off = 0;
    for(;;){
      const page = await sbGet(path + '&limit=1000&offset=' + off);
      out = out.concat(page);
      if (page.length < 1000) return out;
      off += 1000;
    }
  }

  let ALL=[];
  let CUR=[];
  function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show');
    clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }
  function showDiag(m){ const d=document.getElementById('diag'); d.style.display='block'; d.textContent=m; }
  function hideDiag(){ document.getElementById('diag').style.display='none'; }
  function uniq(a){ return [...new Set(a.filter(x=>x!=null && x!==''))]; }
  function fillSel(id, values, allLabel){
    const sel=document.getElementById(id); const cur=sel.value;
    sel.innerHTML=`<option value="">${allLabel}</option>`+values.map(v=>`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');
    if(values.indexOf(cur)!==-1) sel.value=cur;
  }

  // 일시적 오류(콜드 스타트·네트워크 흔들림·비정상 응답) 시 자동으로 다시 시도
  async function fetchJSON(url, tries){
    tries = tries || 3;
    let lastErr;
    for(let i=0;i<tries;i++){
      try{
        const res = await fetch(url, { cache:'no-store' });
        const text = await res.text();
        try{ return JSON.parse(text); }
        catch(e){ lastErr = new Error('서버가 일시적으로 비정상 응답을 보냈습니다'); }
      }catch(e){ lastErr = e; }
      if(i < tries-1) await new Promise(r=>setTimeout(r, 700*(i+1)));  // 0.7s → 1.4s 대기 후 재시도
    }
    throw lastErr || new Error('요청 실패');
  }

  async function reload(){
    document.getElementById('loading').style.display='block';
    document.getElementById('listTbl').style.display='none';
    document.getElementById('empty').style.display='none';
    hideDiag();
    try{
      let list = null;
      try{
        const BASE = 'id,ts,teacher,code,school,grade,name,got,total,questions';
        let rows;   // 다시 풀기 열(064)이 없는 DB면 옛 열만 다시 읽는다
        // 화면 이탈 열(066)·다시 풀기 열(064)이 없는 DB면 있는 열만 다시 읽는다
        try{ rows = await sbAllRows('/hwork_submissions?select=' + BASE + ',retry_at,review,review_at,away_n,away_sec,reply&order=id.desc'); RETRY_COL = true; AWAY_COL = true; REPLY_COL = true; }
        catch(eR){ REPLY_COL = false; try{ rows = await sbAllRows('/hwork_submissions?select=' + BASE + ',retry_at,review,review_at,away_n,away_sec&order=id.desc'); RETRY_COL = true; AWAY_COL = true; }
        catch(e0){ AWAY_COL = false;
          try{ rows = await sbAllRows('/hwork_submissions?select=' + BASE + ',retry_at,review,review_at&order=id.desc'); RETRY_COL = true; }
          catch(e){ rows = await sbAllRows('/hwork_submissions?select=' + BASE + '&order=id.desc'); RETRY_COL = false; } } }
        list = rows.map(r => ({ _id: r.id, submittedAt: r.ts, teacher: r.teacher, code: r.code,
          school: r.school, grade: r.grade, name: r.name, got: String(r.got), total: String(r.total),
          qCount: Object.keys(r.questions || {}).length,
          fix: fixSum(r.review, (Number(r.total)||0) - (Number(r.got)||0), r.reply), reviewed: !!r.review_at,
          awayN: Number(r.away_n)||0, awaySec: Number(r.away_sec)||0 }));
      }catch(e){ console.warn('수파베이스 목록 실패 — 기존 백엔드(시트)로 폴백', e); }
      if (!list){
        const json=await fetchJSON(API_URL+'?action=responses');
        if(!json.ok){ showDiag('목록 오류: '+(json.error||'')); document.getElementById('loading').style.display='none'; return; }
        list = json.list||[];
      }
      ALL=list;
      fillSel('fTeacher', uniq(ALL.map(r=>r.teacher)), '전체 강사');
      fillSel('fCode',    uniq(ALL.map(r=>r.code)),    '전체 제목');
      fillSel('fSchool',  uniq(ALL.map(r=>r.school)),  '전체 학교');
      fillSel('fGrade',   uniq(ALL.map(r=>r.grade)),   '전체 학년');
      document.getElementById('loading').style.display='none';
      applyFilter();
    }catch(err){
      document.getElementById('loading').style.display='none';
      showDiag('서버 연결에 실패했습니다. 인터넷 연결과 배포 주소를 확인해 주세요.\n('+err+')');
    }
  }

  function applyFilter(){
    const t=document.getElementById('fTeacher').value;
    const c=document.getElementById('fCode').value;
    const s=document.getElementById('fSchool').value;
    const g=document.getElementById('fGrade').value;
    const q=document.getElementById('q').value.trim();
    const onlyHelp=document.getElementById('fHelp').checked;
    const tbl=document.getElementById('listTbl'), body=document.getElementById('listBody'), empty=document.getElementById('empty');
    document.getElementById('qbtn').style.display='none';
    document.getElementById('qpanel').style.display='none';
    document.getElementById('rtbtn').style.display='none';
    document.getElementById('rtpanel').style.display='none';

    // 담당 강사를 고르기 전에는 목록을 보여주지 않음
    if(!t){
      tbl.style.display='none';
      empty.style.display='block';
      empty.textContent='위에서 담당 강사를 선택하면 제출 목록이 표시됩니다.';
      document.getElementById('summary').innerHTML='';
      return;
    }

    const rows=ALL.filter(r=>
      (r.teacher===t) && (!c||r.code===c) && (!s||r.school===s) && (!g||r.grade===g) &&
      (!q||(r.name||'').includes(q)) && (!onlyHelp || (r.fix && r.fix.help > r.fix.rep)) );
    CUR=rows;

    // 요약
    let sumLine=`제출 <b>${rows.length}</b>건`;
    if(rows.length){
      let acc=0,n=0;
      rows.forEach(r=>{ const tot=Number(r.total)||0; if(tot>0){ acc+=Number(r.got)/tot; n++; } });
      if(n) sumLine+=` · 평균 정답률 <b>${Math.round(acc/n*100)}%</b>`;
    }
    document.getElementById('summary').innerHTML=sumLine;

    if(!rows.length){ tbl.style.display='none'; empty.style.display='block'; empty.textContent='조건에 맞는 제출이 없습니다.'; return; }
    empty.style.display='none'; tbl.style.display='table';
    body.innerHTML=rows.map((r,i)=>`<tr class="r" onclick="openReportAt(${i})">
      <td>${escapeHtml(r.teacher||'')}</td><td>${escapeHtml(r.code||'')}</td>
      <td class="nm">${escapeHtml(r.name||'')}${Number(r.qCount)>0?` <span class="qbadge">질문 ${r.qCount}</span>`:''}</td>
      <td class="sc">${escapeHtml(r.got)} / ${escapeHtml(r.total)}${retryTag(r)}</td>
      <td>${escapeHtml(r.school||'')}</td><td>${escapeHtml(r.grade||'')}</td>
      <td class="date">${escapeHtml(shortDate(r.submittedAt))}</td></tr>`).join('');
    if(c && rows.length) document.getElementById('qbtn').style.display='block';
    if(c && rows.length && rows[0]._id) document.getElementById('rtbtn').style.display='block';
  }

  /* 오답하기 표시 (064·065) — 1차 점수 옆에 '오답 클리어 n/m · 도움 k · 신고 j' */
  let RETRY_COL = false;
  let REPLY_COL = false;   // 도움 요청 답장 열(067)
  function fixSum(rv, nwrong, rp){
    const o={ n:nwrong, clr:0, help:0, err:0, rep:0, any:false };
    Object.keys(rv||{}).forEach(k=>{ const v=rv[k]; o.any=true; if(v.cleared_at) o.clr++; if(v.help){ o.help++; if(rp && rp[k]) o.rep++; } if(v.error) o.err++; });
    return o;
  }
  /* 화면 이탈 (066, 2026-11-12) — 푸는 동안 다른 앱으로 넘어가거나 화면을 끈 횟수·시간. 0이면 표시 안 함 */
  let AWAY_COL = false;
  const AWAY_FROM = '2026-11-12';   // 이 날부터 센다 — 그 전 제출의 0은 '기록 없음'이 아니라 '세지 않음'
  function awayDur(sec){ sec=Number(sec)||0; if(sec<60) return sec+'초'; const m=Math.floor(sec/60), x=sec%60; return m+'분'+(x?' '+x+'초':''); }
  function awayTag(r){ return r.awayN? ` <span class="rtag aw" title="푸는 동안 다른 앱으로 넘어가거나 화면을 끈 횟수와 시간">이탈 ${r.awayN}회 · ${awayDur(r.awaySec)}</span>` : ''; }
  function retryTag(r){
    const f=r.fix; if(!f || !f.any) return awayTag(r);
    return ` <span class="rtag">오답 ${f.clr}/${f.n}${r.reviewed?' ✓':''}</span>`+(f.help?(REPLY_COL&&f.rep>=f.help?` <span class="rtag rp">도움 ${f.help} · 답장함</span>`:` <span class="rtag hp">도움 ${f.help}${REPLY_COL&&f.rep?` · 답장 ${f.rep}`:''}</span>`):'')+(f.err?` <span class="rtag hp">신고 ${f.err}</span>`:'')+awayTag(r);
  }

  function shortDate(s){
    if(!s) return '';
    const d=new Date(s);
    if(isNaN(d.getTime())) return String(s).replace(/\s+/g,' ').trim();
    const opt={ timeZone:'Asia/Seoul' };
    const datePart=d.toLocaleDateString('ko-KR', Object.assign({ year:'numeric', month:'long', day:'numeric' }, opt));
    const timePart=d.toLocaleTimeString('ko-KR', Object.assign({ hour:'2-digit', minute:'2-digit', hour12:false }, opt));
    return datePart+' '+timePart;
  }

  /* 한 제출의 상세 — 원본(수파베이스, _id) 우선 · 시트 목록(폴백)이면 옛 행 조회 */
  async function reportOf(r){
    if (r && r._id){
      const cols = 'ts,teacher,code,school,grade,name,got,total,detail,questions' + (RETRY_COL ? ',retry_at,review,review_at' : '') + (AWAY_COL ? ',away_n,away_sec' : '') + (REPLY_COL ? ',reply' : '');
      const rows = await sbGet('/hwork_submissions?id=eq.' + r._id + '&select=' + cols);
      if (!rows || !rows.length) throw new Error('gone');
      const x = rows[0];
      return { id: r._id, reply: x.reply || {}, student: { teacher: x.teacher, code: x.code, school: x.school, grade: x.grade, name: x.name },
               result: { got: Number(x.got), total: Number(x.total), detail: x.detail },
               questions: x.questions || {}, submittedAt: x.ts,
               review: x.review || null, reviewAt: x.review_at || '', fixOn: RETRY_COL,
               away: AWAY_COL ? { n: Number(x.away_n)||0, sec: Number(x.away_sec)||0 } : null,
               files: (REPLY_COL && x.review && Object.values(x.review).some(v=>v&&v.help)) ? await rpFilesOf(r._id) : {} };
    }
    const json = await fetchJSON(API_URL+'?action=report&row='+encodeURIComponent(r.row));
    if (!json.ok) throw new Error(json.error || '조회 오류');
    return json.report;
  }
  async function openReportAt(i){
    const r = CUR && CUR[i];
    if (!r) return;
    toast('불러오는 중…');
    try{ renderReport(await reportOf(r)); }
    catch(err){ toast('조회 실패 · 다시 시도해 주세요'); }
  }

  /* 전체 문항 수 — 서술형(essay)은 채점 문항 수(total)에서 빠지므로 detail 로 센다 */
  function itemCount(r){
    let n=Math.max(Number(r.count)||0, Number(r.total)||0);
    Object.keys(r.detail||{}).forEach(k=>{ const v=Number(k); if(v>n) n=v; });
    return n;
  }
  function renderReport(rep){
    const st=rep.student, r=rep.result;
    const pct=r.total? Math.round(r.got/r.total*100):0;
    let rows='';
    const qmap = rep.questions || {};
    const n=itemCount(r); let ne=0;
    const hasR=!!rep.fixOn;
    for(let q=1;q<=n;q++){ const d=r.detail[q]||{};
      const mine=(d.mine&&String(d.mine).length)?escapeHtml(d.mine):'<span class="blank">무응답</span>';
      const qtext = qmap[q] ? escapeHtml(qmap[q]) : '';
      if(d.type==='essay'){ ne++;   // 서술형(예시 답 비교) — 채점하지 않음, 학생 답·예시 답을 그대로 보여 준다
        rows+=`<tr class="essay"><td class="qn">${q}</td>
          <td class="mine">${mine}</td><td class="ansc">${escapeHtml(d.ans||'')}</td>
          <td class="cmp">비교</td>${hasR?'<td></td>':''}
          <td class="qcell${qtext?' has':''}">${qtext}</td></tr>`;
        continue;
      }
      rows+=`<tr class="${d.ok?'':'wrong'}"><td class="qn">${q}</td>
        <td class="mine">${mine}</td><td class="ansc">${escapeHtml(d.ans||'')}</td>
        <td class="${d.ok?'o':'x'}">${d.ok?'O':'X'}</td>${hasR?r2cell(d.ok===false?(rep.review||{})[q]:null, d.ok===false):''}
        <td class="qcell${qtext?' has':''}">${qtext}</td></tr>`;
    }
    window.CURNAME = st.name || '학생'; window.CURCODE = st.code || ''; window.CURREP = rep;
    document.getElementById('report').innerHTML=`
      <div class="back"><button onclick="closeReport()">← 목록으로</button><button class="saveimg" onclick="saveImage()">이미지로 저장</button></div>
      <div id="shot">
      <div class="rbrand"><div class="name">이수경국어</div><div class="sub">Shueguk · H WORK</div></div>
      <div class="tbar">${escapeHtml(st.code)}</div>
      <section><h2>학생 정보</h2>
        <table class="info"><tr><th>이름</th><th>학교</th><th>학년</th><th>담당 강사</th><th>제출일</th></tr>
        <tr><td>${escapeHtml(st.name)}</td><td>${escapeHtml(st.school)}</td><td>${escapeHtml(st.grade)}</td>
        <td>${escapeHtml(st.teacher)}</td><td>${escapeHtml(shortDate(rep.submittedAt))}</td></tr></table></section>
      <section><h2>채점 결과</h2>
        <div class="scoreline"><span class="big">${r.got} / ${r.total}</span> <span class="pct">(${pct}점)</span></div>${retryLine(rep, r)}${awayLine(rep)}${ne?`<div class="snote">서술형 ${ne}문항은 채점하지 않습니다 — 학생 답과 예시 답을 비교해 주세요.</div>`:''}</section>
      <section><h2>문항별 채점</h2>
        <table class="detail">${hasR?'<colgroup><col style="width:10%"><col style="width:17%"><col style="width:17%"><col style="width:11%"><col style="width:15%"><col style="width:30%"></colgroup>':'<colgroup><col style="width:12%"><col style="width:18%"><col style="width:18%"><col style="width:17%"><col style="width:35%"></colgroup>'}<tr><th>문항</th><th>학생 답</th><th>정답</th><th>${hasR?'1차':'정오'}</th>${hasR?'<th>오답하기</th>':''}<th>질문</th></tr>${rows}</table></section>
      ${reviewHtml(rep)}
      </div>`;
    document.getElementById('listView').style.display='none';
    document.getElementById('report').style.display='block';
    window.scrollTo(0,0);
    if(REPLY_COL && rep.id && Object.values(rep.review||{}).some(v=>v&&v.help)) alimCfgLoad();
    tqiPaint(st.code);
  }
  /* 교재 문항 그림 (2026-11-16, 리포트 마이그레이션 068) — 오답하기 기록에 그 번호의 교재 문항을 띄운다.
   * hwork_item_imgs_t(교사 계정)로 목록을 받고 hwork-items 버킷에서 교사 신분으로 받는다. 그림이 없는 과제면 버튼을 숨긴다. */
  const TQI={ code:null, items:null, blobs:{}, busy:false };
  function tqiRow(q, open){
    return `<tr class="qirow" data-html2canvas-ignore="true"><td class="qn"></td><td colspan="5">
      <button type="button" class="qibtn" data-qi="${q}" onclick="tqiToggle(${q})" style="display:none">${open?'교재 문항 접기':'교재 '+q+'번 문항 보기'}</button>
      <div class="tqimg" id="tqi${q}" data-q="${q}" data-open="${open?1:0}"></div></td></tr>`;
  }
  function tqiToggle(q){
    const box=document.getElementById('tqi'+q), b=document.querySelector('.qibtn[data-qi="'+q+'"]'); if(!box) return;
    const open=box.dataset.open!=='1'; box.dataset.open=open?'1':'0';
    if(b) b.textContent=open?'교재 문항 접기':'교재 '+q+'번 문항 보기';
    tqiPaint(TQI.code);
  }
  async function tqiBlob(path){
    if(TQI.blobs[path]) return TQI.blobs[path];
    const t=await sbAuth();
    const r=await fetch(SB_URL+'/storage/v1/object/authenticated/hwork-items/'+path.split('/').map(encodeURIComponent).join('/'),
      { headers:{ apikey:SB_KEY, Authorization:'Bearer '+t } });
    if(!r.ok) throw new Error('img '+r.status);
    return TQI.blobs[path]=URL.createObjectURL(await r.blob());
  }
  async function tqiPaint(code){
    if(!document.querySelector('.tqimg')) return;
    if(TQI.code!==code){
      if(TQI.busy) return; TQI.busy=true;
      try{ const j=await sbSend('POST', '/rpc/hwork_item_imgs_t', { p:{ code } }); TQI.items=(j&&j.ok)?(j.items||{}):{}; }
      catch(e){ TQI.items={}; }
      TQI.code=code; TQI.busy=false;
    }
    document.querySelectorAll('.tqimg').forEach(box=>{
      const q=box.dataset.q, list=(TQI.items||{})[q]||[], b=document.querySelector('.qibtn[data-qi="'+q+'"]');
      if(!list.length){ if(b) b.style.display='none'; box.style.display='none'; return; }
      if(b) b.style.display='';
      const open=box.dataset.open==='1'; box.style.display=open?'block':'none';
      if(!open || box.dataset.ldd) return;
      box.dataset.ldd='1';
      box.innerHTML=list.map(x=>`<div class="qip" style="aspect-ratio:${Number(x.w)||500}/${Number(x.h)||300}" data-p="${escapeHtml(x.path)}"></div>`).join('');
      box.querySelectorAll('.qip').forEach(el=>tqiBlob(el.dataset.p).then(u=>{ el.innerHTML=`<img src="${u}" alt="${q}번 문항">`; })
        .catch(()=>{ el.innerHTML='<span class="m2">문항 그림을 불러오지 못했어요</span>'; delete box.dataset.ldd; }));
    });
  }
  function awayLine(rep){
    const a=rep.away; if(!a) return '';
    return a.n? `<div class="snote awl">푸는 동안 화면을 벗어난 기록: ${a.n}회 · 모두 ${awayDur(a.sec)} (다른 앱으로 넘어가거나 화면을 끈 경우)</div>`
              : (String(rep.submittedAt||'')>=AWAY_FROM ? '<div class="snote">푸는 동안 화면을 벗어난 기록이 없습니다.</div>' : '');
  }
  function r2cell(v, wrong){
    if(!wrong) return '<td></td>';
    if(!v) return '<td><span class="m2">아직</span></td>';
    const n=(v.tries||[]).length, t=[];
    t.push(v.cleared_at?`<span class="o">클리어</span><div class="m2">${n}번째에</div>`:`<span class="x">${n?'진행 중':'아직'}</span>${n?`<div class="m2">${n}번 시도</div>`:''}`);
    if(v.help) t.push('<div class="m2 flg">도움 요청</div>'); if(v.error) t.push('<div class="m2 flg">오류 신고</div>');
    return `<td>${t.join('')}</td>`;
  }
  function retryLine(rep, r){
    if(!rep.fixOn) return '';
    const wq=Object.keys(r.detail||{}).filter(k=>r.detail[k]&&r.detail[k].ok===false);
    if(!wq.length) return '';
    const rv=rep.review||{}; let clr=0, help=0, err=0;
    wq.forEach(q=>{ const v=rv[q]||{}; if(v.cleared_at) clr++; if(v.help) help++; if(v.error) err++; });
    if(!Object.keys(rv).length) return `<div class="snote">아직 틀린 문항 ${wq.length}개를 오답하기 하지 않았습니다.</div>`;
    let t=`오답하기: 틀린 ${wq.length}문항 중 <b>${clr}문항</b> 클리어`;
    if(help) t+=` · 도움 요청 ${help}`; if(err) t+=` · 오류 신고 ${err}`;
    t+= rep.reviewAt ? ` · 마침 (${escapeHtml(shortDate(rep.reviewAt))})` : ' · 진행 중';
    return `<div class="snote">${t}</div>`;
  }
  function reviewHtml(rep){
    const rv=rep.review; if(!rv) return '';
    const ks=Object.keys(rv).map(Number).sort((a,b)=>a-b); if(!ks.length) return '';
    let rows='';
    ks.forEach(q=>{ const v=rv[q]||{}, tr=v.tries||[];
      rows+=tqiRow(q, !!(v.help||v.error));
      tr.forEach((t,i)=>{ rows+=`<tr><td class="qn">${i?'':q}</td><td>${i+1}</td><td>${escapeHtml(t.wrong||'')}</td>
        <td class="fixc">${escapeHtml(t.why_wrong||'')}</td><td>${escapeHtml(t.pick||'')} <b class="${t.ok?'o':'x'}">${t.ok?'O':'X'}</b></td>
        <td class="fixc">${escapeHtml(t.why_right||'')}</td></tr>`; });

  // 선택한 시험(제목)의 문항별 오답률을 모아 높은 순으로 보여준다
  async function analyzeQuestions(){
    if(!CUR || !CUR.length){ toast('분석할 제출이 없습니다'); return; }
    const code=document.getElementById('fCode').value;
    const btn=document.querySelector('#qbtn button'); const label=btn.textContent;
    btn.disabled=true; btn.textContent='분석 중… ('+CUR.length+'명)';
    try{
      const reports=await Promise.all(CUR.map(r=>
        reportOf(r).catch(()=>null)
      ));
      const valid=reports.filter(Boolean);
      if(!valid.length){ toast('데이터를 불러오지 못했습니다'); return; }
      const total=Math.max(...valid.map(v=>itemCount(v.result)));
      const N=valid.length;
      const stat=[];
      for(let qn=1; qn<=total; qn++){
        let wrong=0, ans='', essay=false, still=0, concept=0;
        valid.forEach(v=>{ const d=v.result.detail[qn]; if(d){ if(d.type==='essay') essay=true; if(d.ok===false) wrong++; if(!ans && d.ans) ans=d.ans; }
          const rv=v.review&&v.review[qn]; if(rv){ if(rv.help) still++; if(rv.error) concept++; } });
        if(essay) continue;   // 서술형(예시 답 비교)은 채점하지 않아 오답률에서 뺀다
        stat.push({ q:qn, wrong:wrong, n:N, rate: N? wrong/N : 0, ans:ans, still:still, concept:concept });
      }
      stat.sort((a,b)=> (b.rate-a.rate) || (a.q-b.q));
      renderQ(stat, code, N);
    } finally {
      btn.disabled=false; btn.textContent=label;
    }
  }

  function renderQ(stat, code, N){
    document.getElementById('qhTitle').textContent=(code||'')+' · 문항별 오답률';
    const rows=stat.map(s=>{
      const pct=Math.round(s.rate*100);
      const hi = s.rate>=0.5 ? ' class="hi"' : '';
      return `<tr${hi}>
        <td class="q">${s.q}</td>
        <td><div class="ratecell"><div class="qbar"><i style="width:${pct}%"></i></div><span class="rate">${pct}%</span></div></td>
        <td>${s.wrong} / ${s.n}</td>${RETRY_COL?`<td>${s.still||''}</td><td>${s.concept?`<b class="cpt">${s.concept}</b>`:''}</td>`:''}
        <td class="ansc">${escapeHtml(s.ans||'')}</td></tr>`;
    }).join('');
    document.getElementById('qbody').innerHTML=`<table class="qrank">
      <thead><tr><th>문항</th><th>오답률</th><th>틀림/응시</th>${RETRY_COL?'<th>도움 요청</th><th>오류 신고</th>':''}<th>정답</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
    document.getElementById('qpanel').style.display='block';
    document.getElementById('qpanel').scrollIntoView({behavior:'smooth', block:'nearest'});
  }
  function closeQ(){ document.getElementById('qpanel').style.display='none'; }


  /* ── 도움 요청 답장 (2026-11-16 원장님, 리포트 마이그레이션 067) ──
   * 학생이 오답하기에서 [선생님 도와주세요]를 누른 문항 아래에 답장 칸. 저장 = hwork_reply(교사 계정만, 빈 글이면 지움).
   * 학생은 학생 페이지 H WORK 목록과 H WORK 오답하기 화면에서 그 문항과 함께 본다.

  const REPORT_API = "https://script.google.com/macros/s/AKfycbzhCncBwn-JlqXARC3wfrWUCuNHzlNK2df0bdhx-w78Xr8mzYUcIYZOJdRi9N4bHtsb/exec";
  const REPORT_KEY = 'sh';   // 리포트 백엔드 교사용 값(허브 알림톡 화면과 같은 공개 수준)
  const RP_KIND = 'notice_hwreply';
  let ME_NAME = '', ALIM_CFG = null, ALIM_LOADING = null;

  async function sbSend(method, path, body, prefer){
    const t = await sbAuth();
    const h = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + t, 'Content-Type': 'application/json' };
    if (prefer) h['Prefer'] = prefer;
    const r = await fetch(SB_URL + '/rest/v1' + path, { method, headers: h, body: body == null ? undefined : JSON.stringify(body) });
    const txt = await r.text();
    if (!r.ok){ const e = new Error('sb ' + r.status + ' ' + txt.slice(0, 200)); e.status = r.status; throw e; }

  function replyRow(rep, q){
    if(!REPLY_COL || !rep.id) return '';
    const v=(rep.reply||{})[q];
    const meta = v ? `${escapeHtml(v.by||'')}${v.by?' · ':''}${escapeHtml(v.at||'')} 저장` : '아직 답장하지 않았습니다';

    const why = !ALIM_CFG ? '알림톡 설정을 불러오는 중이거나 불러오지 못했습니다' : (!ready ? "'H WORK 질문 답변 안내' 템플릿이 아직 심사 중입니다" : '학생·학부모님께 알림톡을 보냅니다');
    return `<tr class="replyrow"><td class="qn"></td><td colspan="5"><div class="rpbox" data-rpq="${q}">
      <div class="rplab">선생님 답장 · 학생 페이지와 오답하기 화면에 ${q}번 문항과 함께 보여요</div>

      ${RPF_ON?`<div class="rpfiles" id="rpF${q}" data-html2canvas-ignore="true">${rpChips(rep, q)}</div>`:''}
      <div class="rpbtns" data-html2canvas-ignore="true"><button type="button" class="pri" id="rpS${q}" onclick="saveReply(${q})">${v?'답장 고치기':'답장 저장'}</button>
        ${RPF_ON?`<button type="button" onclick="document.getElementById('rpI${q}').click()">사진·영상·파일 첨부</button>
        <input type="file" id="rpI${q}" multiple hidden onchange="rpPick(${q}, this.files); this.value=''">`:''}
        <button type="button" id="rpA${q}" onclick="replyAlim(${q})" ${v&&ready?'':'disabled'} title="${escapeHtml(v?why:'답장을 먼저 저장해 주세요')}">알림톡 보내기</button>
        <span class="m2" id="rpM${q}">${meta}</span></div></div></td></tr>`;
  }
  async function saveReply(q){
    const rep=window.CURREP; if(!rep||!rep.id) return;
    const el=document.getElementById('rpT'+q), txt=(el.value||'').trim(), had=!!(rep.reply||{})[q];

    if(!txt && !pend.length && !nOld && !confirm(q+'번 답장을 지울까요? 학생 화면에서도 사라집니다.')) return;

      }
      const j=await sbSend('POST', '/rpc/hwork_reply', { p:{ id:rep.id, q:String(q), text:txt, by:ME_NAME } });
      if(!j || !j.ok){ toast((j&&j.error)||'저장하지 못했어요'); btn.disabled=false; return; }
      rep.reply=rep.reply||{};
      if(j.removed) delete rep.reply[q]; else rep.reply[q]=j.reply;
      delete RP_PEND[rep.id+'|'+q];
      if(RPF_ON) rep.files=await rpFilesOf(rep.id);
      const row=ALL.find(x=>x._id===rep.id);
      if(row && row.fix){ row.fix.rep=Object.keys(rep.reply).filter(k=>(rep.review||{})[k]&&rep.review[k].help).length; }
      toast(j.removed?'답장을 지웠습니다':'답장을 저장했습니다. 학생 화면에 바로 보여요');

  }

  /* ── 답장 첨부 — 사진·영상·파일 (같은 날 원장님 "답장할 때 사진, 영상, 파일 첨부 기능 필요") ──
   * 고른 파일은 [답장 저장]을 누를 때 비공개 버킷 hwork-reply-files(경로 r/{제출}/{무작위}.{확장자})에 올리고
   * 표 hwork_reply_files 에 줄을 넣는다. 파일당 50MB · 문항마다 10개. 글 칸에 캡처를 붙여 넣거나 답장 칸에 끌어 놓아도 된다.
   * 학생은 hwork_reply_file_url 로 10분 창을 열어 받는다. 067 전 DB(표 없음)면 첨부 단추를 숨긴다. */
  const RPF_BUCKET='hwork-reply-files', RPF_MAX=50*1024*1024, RPF_N=10;
  let RPF_ON=false;
  const RP_PEND={};   // '제출|문항' → File[]
  function rpPend(rep, q){ return RP_PEND[rep.id+'|'+q] || []; }
  async function rpFilesOf(sub){
    try{
      const rows=await sbGet('/hwork_reply_files?sub_id=eq.'+sub+'&select=id,q,path,name,size,mime&order=id');
      RPF_ON=true;
      const out={}; rows.forEach(f=>{ (out[f.q]=out[f.q]||[]).push(f); }); return out;
    }catch(e){ RPF_ON=false; return {}; }
  }
  function rpSize(n){ n=Number(n)||0; return n>=1048576?(n/1048576).toFixed(1)+'MB':Math.max(1,Math.round(n/1024))+'KB'; }
  function rpKind(m, nm){ m=String(m||''); if(m.indexOf('image/')===0) return '사진'; if(m.indexOf('video/')===0) return '영상';
    return /\.(png|jpe?g|gif|webp|heic)$/i.test(nm||'')?'사진':/\.(mp4|mov|m4v|webm)$/i.test(nm||'')?'영상':'파일'; }
  function rpChips(rep, q){
    const old=((rep.files||{})[q]||[]).map(f=>`<span class="rpf"><button type="button" class="nm" title="열어 보기" onclick="rpOpen(${f.id})">${rpKind(f.mime,f.name)} · ${escapeHtml(f.name)}</button><span class="sz">${rpSize(f.size)}</span><button type="button" class="x" title="지우기" onclick="rpDel(${q},${f.id})">×</button></span>`).join('');
    const pend=rpPend(rep, q).map((f,i)=>`<span class="rpf pend" title="[답장 저장]을 누르면 올라갑니다">${rpKind(f.type,f.name)} · <span class="nm">${escapeHtml(f.name)}</span><span class="sz">${rpSize(f.size)} · 저장 전</span><button type="button" class="x" title="빼기" onclick="rpUnpick(${q},${i})">×</button></span>`).join('');
    return old+pend;
  }
  function rpRerender(q){
    const rep=window.CURREP; if(!rep) return;
    const keep=document.getElementById('rpT'+q); const txt=keep?keep.value:null;
    const y=window.scrollY; renderReport(rep); window.scrollTo(0,y);
    const el=document.getElementById('rpT'+q); if(el && txt!=null && !(rep.reply||{})[q]) el.value=txt;
  }
  function rpDraw(q){ const rep=window.CURREP, box=document.getElementById('rpF'+q); if(rep && box) box.innerHTML=rpChips(rep, q); }
  function rpPasteName(f){
    if(f.name && !/^image\.(png|jpe?g|gif|webp)$/i.test(f.name)) return f.name;
    const d=new Date(), z=n=>String(n).padStart(2,'0');
    return '캡처_'+z(d.getMonth()+1)+z(d.getDate())+'_'+z(d.getHours())+z(d.getMinutes())+z(d.getSeconds())+'.'+((f.type.split('/')[1]||'png').replace('jpeg','jpg'));
  }
  function rpPick(q, list, pasted){
    const rep=window.CURREP; if(!rep||!rep.id||!list) return;
    const k=rep.id+'|'+q, arr=RP_PEND[k]=RP_PEND[k]||[], have=((rep.files||{})[q]||[]).length;
    const big=[], empty=[]; let over=0;
    Array.from(list).forEach(f=>{
      if(!f.size){ empty.push(f.name||'이름 없는 파일'); return; }
      if(f.size>RPF_MAX){ big.push(f.name); return; }
      if(have+arr.length>=RPF_N){ over++; return; }
      if(pasted) try{ f=new File([f], rpPasteName(f), { type:f.type }); }catch(e){}
      arr.push(f);
    });
    rpDraw(q);
    const why=[]; if(big.length) why.push('50MB가 넘어 뺀 파일: '+big.join(', ')+' (긴 영상은 유튜브 일부 공개 주소를 답장 글에 붙여 주세요)');
    if(empty.length) why.push('빈 파일이라 뺐습니다: '+empty.join(', '));
    if(over) why.push('한 문항에 '+RPF_N+'개까지 붙일 수 있어요');
    if(why.length) toast(why.join(' · '));
  }
  function rpUnpick(q, i){ const rep=window.CURREP; if(!rep) return; const a=RP_PEND[rep.id+'|'+q]; if(a){ a.splice(i,1); rpDraw(q); } }
  function rpRand(){ const a=new Uint8Array(12); crypto.getRandomValues(a); return Array.from(a,b=>b.toString(16).padStart(2,'0')).join('').slice(0,24); }
  function rpExt(f){ const m=/\.([A-Za-z0-9]{1,8})$/.exec(f.name||''); if(m) return m[1].toLowerCase();
    const t=String(f.type||'').split('/')[1]||'bin'; return t.replace('jpeg','jpg').replace('quicktime','mov').replace(/[^a-z0-9]/gi,'').slice(0,8)||'bin'; }
  async function rpStorage(method, path, body, type){
    const t=await sbAuth();
    const h={ 'apikey':SB_KEY, 'Authorization':'Bearer '+t };
    if(type) h['Content-Type']=type;
    if(method==='POST') h['x-upsert']='false';
    const r=await fetch(SB_URL+'/storage/v1/object/'+(method==='GET'?'authenticated/':'')+RPF_BUCKET+'/'+path, { method, headers:h, body });
    if(!r.ok) throw new Error('storage '+r.status);
    return r;
  }
  async function rpUpload(rep, q, files, say){
    const done=[];
    try{
      for(let i=0;i<files.length;i++){
        const f=files[i], path='r/'+rep.id+'/'+rpRand()+'.'+rpExt(f);
        say('파일 올리는 중 '+(i+1)+' / '+files.length+' · '+f.name);
        await rpStorage('POST', path, f, f.type||'application/octet-stream');
        done.push({ sub_id:rep.id, q:String(q), path, name:String(f.name||'파일').slice(0,200), size:f.size, mime:f.type||'', created_by:ME_NAME||'' });
      }
      await sbSend('POST', '/hwork_reply_files', done, 'return=minimal');
      return true;
    }catch(e){
      for(const d of done){ try{ await rpStorage('DELETE', d.path); }catch(e2){} }
      say('파일을 올리지 못했습니다');
      toast('파일을 올리지 못했어요. 답장은 저장하지 않았습니다 · 다시 눌러 주세요');
      return false;
    }
  }
  async function rpOpen(fid){
    const rep=window.CURREP; if(!rep) return;
    const f=[].concat(...Object.values(rep.files||{})).find(x=>x.id===fid); if(!f) return;
    const w=window.open('', '_blank');
    try{
      const r=await rpStorage('GET', f.path);
      const url=URL.createObjectURL(await r.blob());
      if(w) w.location.href=url; else { const a=document.createElement('a'); a.href=url; a.download=f.name; a.click(); }
      setTimeout(()=>URL.revokeObjectURL(url), 120000);
    }catch(e){ if(w) w.close(); toast('파일을 열지 못했어요'); }
  }
  async function rpDel(q, fid){
    const rep=window.CURREP; if(!rep) return;
    const f=((rep.files||{})[q]||[]).find(x=>x.id===fid); if(!f) return;
    if(!confirm(f.name+' 파일을 지울까요? 학생 화면에서도 사라집니다.')) return;
    try{
      try{ await rpStorage('DELETE', f.path); }catch(e){}
      await sbSend('DELETE', '/hwork_reply_files?id=eq.'+fid, null, 'return=minimal');
      rep.files=await rpFilesOf(rep.id);
      const v=(rep.reply||{})[q];
      if(v && !String(v.text||'').trim() && !((rep.files||{})[q]||[]).length){   // 글 없이 파일만 있던 답장 → 답장도 지움
        const j=await sbSend('POST', '/rpc/hwork_reply', { p:{ id:rep.id, q:String(q), text:'', by:ME_NAME } });
        if(j && j.ok && j.removed) delete rep.reply[q];
      }
      toast('파일을 지웠습니다'); rpRerender(q);
    }catch(e){ toast('지우지 못했어요 · 다시 눌러 주세요'); }
  }
  // 글 칸에 캡처 붙여 넣기 · 답장 칸에 끌어 놓기
  document.addEventListener('paste', e=>{
    const ta=e.target && e.target.closest && e.target.closest('textarea[data-rpq]'); if(!ta || !RPF_ON) return;
    const fs=Array.from((e.clipboardData&&e.clipboardData.files)||[]); if(!fs.length) return;
    e.preventDefault(); rpPick(ta.dataset.rpq, fs, true);
  });
  ['dragover','dragleave','drop'].forEach(t=>document.addEventListener(t, e=>{
    const box=e.target && e.target.closest && e.target.closest('.rpbox[data-rpq]'); if(!box || !RPF_ON) return;
    if(!e.dataTransfer || Array.from(e.dataTransfer.types||[]).indexOf('Files')<0) return;
    e.preventDefault();
    if(t==='dragover') box.classList.add('drop'); else box.classList.remove('drop');
    if(t==='drop') rpPick(box.dataset.rpq, e.dataTransfer.files);
  }));
  function alimCfgLoad(){
    if(ALIM_CFG || ALIM_LOADING) return ALIM_LOADING;
    ALIM_LOADING = fetch(REPORT_API+'?'+new URLSearchParams({ action:'alimConfig', pw:REPORT_KEY, t:Date.now() }))
      .then(r=>r.json()).then(d=>{ ALIM_CFG=(d&&d.result==='success')?d:null; })
      .catch(()=>{ ALIM_CFG=null; })
      .then(()=>{ ALIM_LOADING=null; if(ALIM_CFG && window.CURREP && document.getElementById('report').style.display==='block'){
        const y=window.scrollY; renderReport(window.CURREP); window.scrollTo(0,y); } });
    return ALIM_LOADING;
  }
  const PHONE_COL = { '학생':'phone_student', '학부모1':'phone_parent1', '학부모2':'phone_parent2' };
  function phoneOk(v){ const d=String(v||'').replace(/\D/g,''); return /^01\d{8,9}$/.test(d)?d:''; }
  function phoneFmt(d){ return d.length===11? d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7) : d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6); }
  function kstYmd(){ const d=new Date(Date.now()+9*3600e3), p=n=>('0'+n).slice(-2); return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate()); }
  /* 제출 ↔ 재원 학생 — 학생 페이지(s.html hworkDoneSet_)·DB hwork_is_me_ 와 같은 규칙. 하나로 정해질 때만 */
  const LEFT_RE = /퇴원|아웃|휴원/;
  function gdOf(g){ const s=String(g||'').replace(/\s+/g,''); const m=s.match(/([1-3])학년/)||s.match(/고([1-3])/); if(m) return m[1]; const a=s.match(/[1-3]/g); return a?a[a.length-1]:''; }
  function stuIsSub(st, sub){
    const nm=String(st.name||'').trim(), base=nm.replace(/[A-Za-z]$/,''), rn=String(sub.name||'').trim();
    if(!nm || (rn!==nm && rn!==base)) return false;
    const mg=gdOf(st.grade), rg=gdOf(sub.grade); if(mg && rg && mg!==rg) return false;
    const ms=String(st.school||'').replace(/\s+/g,''), rs=String(sub.school||'').replace(/\s+/g,'');
    if(ms && rs && ms.indexOf(rs)<0 && rs.indexOf(ms)<0) return false;
    return true;
  }
  let STU_CACHE = null;
  async function students(){
    if(STU_CACHE) return STU_CACHE;
    const rows = await sbAllRows('/students?select=code,name,school,grade,enrolled,phone_student,phone_parent1,phone_parent2&order=id.asc');
    STU_CACHE = rows.filter(s=>!LEFT_RE.test(String(s.enrolled||'')));
    return STU_CACHE;
  }
  function findStu(list, sub){ const hit=list.filter(s=>stuIsSub(s, sub)); return hit.length===1?hit[0]:(hit.length?'dup':null); }
  async function replyAlim(q){
    const rep=window.CURREP, st=rep&&rep.student; if(!rep||!st) return;
    if(!(rep.reply||{})[q]){ toast('답장을 먼저 저장해 주세요'); return; }
    const btn=document.getElementById('rpA'+q); btn.disabled=true;
    try{
      const s=findStu(await students(), st);
      if(s==='dup'){ toast('같은 이름의 학생이 여럿이라 받는 분을 정하지 못했습니다'); btn.disabled=false; return; }
      if(!s){ toast('재원 명단에서 이 학생을 찾지 못했습니다'); btn.disabled=false; return; }
      if(!s.code){ toast('이 학생은 접근코드가 없어 학생 페이지 버튼을 보낼 수 없습니다'); btn.disabled=false; return; }
      const seen={}, items=[], lines=[];
      ['학생','학부모1','학부모2'].forEach(w=>{ const to=phoneOk(s[PHONE_COL[w]]); if(!to || seen[to]) return; seen[to]=1;
        items.push({ student:s.name, to, who:w, cls:'H WORK', date:'N:'+kstYmd()+'|'+st.code,
                     vars:{ '학생명':s.name, '제목':st.code, '접근코드':s.code } });
        lines.push((w==='학생'?'학생':w.replace('학부모','학부모님'))+' '+phoneFmt(to)); });
      if(!items.length){ toast('등록된 연락처가 없습니다'); btn.disabled=false; return; }
      if(!confirm(s.name+" 학생에게 'H WORK 질문 답변 안내' 알림톡을 보낼까요?\n\n▶ "+st.code+"\n받는 분: "+lines.join(', ')+"\n\n같은 날 같은 과제로 이미 받은 분은 건너뜁니다.")){ btn.disabled=false; return; }
      const res=await fetch(REPORT_API,{ method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({ pw:REPORT_KEY, action:'alimSend', kind:RP_KIND, by:ME_NAME, items }) }).then(r=>r.json());
      if(!res || res.result!=='success' || !Array.isArray(res.sent)) throw new Error((res&&res.message)||'알 수 없는 답');
      const ok=res.sent.filter(x=>x.ok&&!x.dup).length, dup=res.sent.filter(x=>x.dup).length, bad=res.sent.filter(x=>!x.ok&&!x.dup);
      document.getElementById('rpM'+q).textContent='알림톡 '+ok+'건 보냄'+(dup?' · 이미 받은 '+dup+'건 건너뜀':'')+(bad.length?' · 실패 '+bad.map(x=>x.who+'('+x.message+')').join(', '):'');
      toast(bad.length?'일부를 보내지 못했습니다':'알림톡을 보냈습니다');
    }catch(e){ toast('알림톡을 보내지 못했습니다: '+((e&&e.message)||'')); }
    btn.disabled=false;
  }

  /* ── 개인 리테스트 (2026-11-16 원장님, 리포트 마이그레이션 067) ──
   * 고른 과제(+ 학교·학년·이름 거르기)를 낸 학생마다 **처음 제출**에서 틀린 문항(서술형 제외)을 모아
   * hwork_retests 에 한 줄씩 넣는다 — 그 학생에게만 보이고, 원 제출 하나에 리테스트 하나. 별은 주지 않는다. */
  let RT = null;
  function closeRetest(){ document.getElementById('rtpanel').style.display='none'; }
  async function openRetest(){
    const t=document.getElementById('fTeacher').value, c=document.getElementById('fCode').value;
    if(!t||!c){ toast('담당 강사와 제목을 골라 주세요'); return; }
    const panel=document.getElementById('rtpanel'), body=document.getElementById('rtbody');
    document.getElementById('rtTitle').textContent=c+' · 리테스트';
    panel.style.display='block'; body.innerHTML='<div class="loading">불러오는 중…</div>';
    try{
      const enc=encodeURIComponent;
      const [subs, list, have] = await Promise.all([
        sbAllRows('/hwork_submissions?teacher=eq.'+enc(t)+'&code=eq.'+enc(c)+'&select=id,ts,name,school,grade,detail&order=id.asc'),
        students(),
        sbGet('/hwork_retests?teacher=eq.'+enc(t)+'&code=eq.'+enc(c)+'&select=id,src_id,name,qs,submitted_at,got,total,detail,created_by,created_at&order=id.asc')
      ]);
      const allow={}; CUR.forEach(r=>{ allow[[r.name,r.school,r.grade].join('|')]=1; });
      const first={}, order=[];
      subs.forEach(r=>{ const k=[r.name,r.school,r.grade].join('|'); if(!allow[k] || first[k]) return; first[k]=r; order.push(k); });
      const bySrc={}; (have||[]).forEach(x=>{ if(x.src_id!=null) bySrc[x.src_id]=x; });
      RT={ t, c, rows: order.map(k=>{
        const r=first[k], d=r.detail||{};
        const wq=Object.keys(d).filter(q=>d[q]&&d[q].ok===false&&d[q].type!=='essay').sort((a,b)=>a-b);
        const ex=bySrc[r.id], st=findStu(list, r);
        let state='new';
        if(ex) state='made'; else if(!wq.length) state='perfect'; else if(st==='dup') state='dup'; else if(!st || !st.code) state='nostu';
        return { r, wq, ex, st:(st&&st!=='dup')?st:null, state, on: state==='new' };
      }) };
      drawRetest();
    }catch(e){
      body.innerHTML='<div class="empty">'+(String(e&&e.message).indexOf('hwork_retests')>=0||(e&&e.status===404)
        ? '리테스트 표가 아직 없습니다. 리포트 마이그레이션 067을 적용해 주세요.' : '불러오지 못했습니다 · 다시 눌러 주세요')+'</div>';
    }
  }
  function drawRetest(){
    const rows=RT.rows, body=document.getElementById('rtbody');
    if(!rows.length){ body.innerHTML='<div class="empty">이 과제를 낸 학생이 없습니다.</div>'; return; }
    const n=rows.filter(x=>x.on).length, made=rows.filter(x=>x.ex).length, sol=rows.filter(x=>x.ex&&x.ex.submitted_at).length;
    const tr=rows.map((x,i)=>{
      const r=x.r; let st='';
      if(x.ex){
        const e=x.ex, still=e.detail?Object.keys(e.detail).filter(q=>e.detail[q]&&e.detail[q].ok===false).sort((a,b)=>a-b):[];
        st = e.submitted_at ? `<span class="rtst done">리테스트 ${e.got} / ${e.total}</span><div class="m2">${escapeHtml(e.submitted_at)}${still.length?' · 또 틀림 '+still.join(', ')+'번':' · 모두 맞힘'}</div>`
          : `<span class="rtst wait">아직 안 풂</span> <button class="rtdel" onclick="delRetest(${i})">지우기</button>`;
      }
      else if(x.state==='perfect') st='<span class="rtst">처음부터 모두 맞힘</span>';
      else if(x.state==='dup') st='<span class="rtst">같은 이름 학생이 여럿 — 만들 수 없음</span>';
      else if(x.state==='nostu') st='<span class="rtst">재원 명단·접근코드 없음 — 만들 수 없음</span>';
      else st='<span class="rtst new">새로 만듦</span>';
      const qs = x.ex ? (x.ex.qs||[]) : x.wq;
      return `<tr class="${x.state==='new'||x.ex?'':'skip'}"><td>${x.state==='new'?`<input type="checkbox" ${x.on?'checked':''} onchange="RT.rows[${i}].on=this.checked;drawRetest()">`:''}</td>
        <td class="l"><b>${escapeHtml(r.name)}</b><div class="m2" style="color:var(--muted);font-size:11.5px">${escapeHtml(r.school)} ${escapeHtml(r.grade)} · 처음 제출 ${escapeHtml(r.ts||'')}</div></td>
        <td class="l">${qs.length?qs.length+'문항 · '+qs.join(', ')+'번':'—'}</td><td>${st}</td></tr>`;
    }).join('');
    body.innerHTML=`<table class="rtt"><tr><th style="width:34px"></th><th>학생</th><th>다시 풀 문항</th><th>상태</th></tr>${tr}</table>
      <div class="rtfoot"><button id="rtGo" onclick="makeRetest()" ${n?'':'disabled'}>${n}명 리테스트 만들기</button>
      <span class="m">이미 만든 리테스트 ${made}명 · 푼 학생 ${sol}명</span></div>`;
  }
  async function makeRetest(){
    const pick=RT.rows.filter(x=>x.on && x.state==='new');
    if(!pick.length) return;
    const nq=pick.reduce((a,x)=>a+x.wq.length,0);
    if(!confirm(RT.c+'\n\n학생 '+pick.length+'명에게 각자 처음 제출에서 틀린 문항(모두 '+nq+'문항)으로 리테스트를 냅니다.\n학생 페이지 H WORK 목록에 바로 보여요. 별은 주지 않습니다.\n만들까요?')) return;
    const btn=document.getElementById('rtGo'); btn.disabled=true; btn.textContent='만드는 중…';
    try{
      await sbSend('POST', '/hwork_retests?on_conflict=src_id', pick.map(x=>({ teacher:RT.t, code:RT.c, src_id:x.r.id, stu_code:x.st.code,
        name:x.r.name, school:x.r.school, grade:x.r.grade, qs:x.wq.map(String), created_by:ME_NAME })), 'resolution=ignore-duplicates,return=minimal');
      toast(pick.length+'명에게 리테스트를 냈습니다');
      openRetest();
    }catch(e){ btn.disabled=false; btn.textContent=pick.length+'명 리테스트 만들기'; toast('만들지 못했습니다 · 다시 눌러 주세요'); }
  }
  async function delRetest(i){
    const x=RT.rows[i]; if(!x||!x.ex||x.ex.submitted_at) return;
    if(!confirm(x.r.name+' 학생의 리테스트를 지울까요? 학생 화면에서도 사라집니다.')) return;
    try{ await sbSend('DELETE', '/hwork_retests?id=eq.'+x.ex.id+'&submitted_at=is.null', null, 'return=minimal'); toast('지웠습니다'); openRetest(); }
    catch(e){ toast('지우지 못했습니다'); }
  }
  reload();
</script>
</body>
</html>
